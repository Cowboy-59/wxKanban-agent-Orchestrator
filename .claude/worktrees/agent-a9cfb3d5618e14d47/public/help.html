<style>
  :root{--ground:#FBFAFC;--surface:#fff;--surface-2:#F4F2F9;--ink:#1E1A2E;--ink-soft:#423B57;--muted:#6B6580;--line:#E7E3F0;--accent:#6534D6;--accent-ink:#4B23A8;--accent-soft:#EDE9FC;--good:#0F8F63;--good-soft:#E2F4EC;--warn:#B4690E;--warn-soft:#FBF0E1;--shadow:0 1px 2px rgba(30,26,46,.06),0 8px 28px -18px rgba(101,52,214,.28);--mono:ui-monospace,"Cascadia Code",Consolas,monospace;--sans:system-ui,"Segoe UI",-apple-system,Roboto,sans-serif}
  @media(prefers-color-scheme:dark){:root{--ground:#141220;--surface:#1C1930;--surface-2:#23203A;--ink:#F1EEF8;--ink-soft:#CFC8E0;--muted:#948CAD;--line:#2C2843;--accent:#A98BF5;--accent-ink:#C4AEFB;--accent-soft:#26203D;--good:#46C596;--good-soft:#143028;--warn:#E0A052;--warn-soft:#2A2113;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7)}}
  *{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px 96px}
  header.mast{padding:48px 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--accent-ink);text-transform:lowercase}
  .brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;font-family:var(--sans)}
  h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;font-weight:800;margin:16px 0 8px;text-wrap:balance}
  .lede{font-size:18px;color:var(--ink-soft);max-width:62ch;margin:0}
  .tiers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 18px}
  @media(min-width:640px){.tiers{grid-template-columns:repeat(4,1fr)}}
  .tier{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit;color:inherit}
  .tier:hover{border-color:var(--accent)}
  .tier.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
  .tier .name{font-weight:650;font-size:14.5px}
  .tier .meta{font-size:12px;color:var(--muted)}
  .legend{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--muted);margin:6px 0 22px}
  .dot2{width:10px;height:10px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:-1px}
  .cat{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:15px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s;text-align:left;font-family:inherit;color:inherit;width:100%}
  .card:hover{border-color:var(--accent)}
  .card.up{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-soft)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h4{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .badge{flex:none;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .badge.inc{color:var(--good)}.badge.up{color:var(--warn)}
  .adm{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .desc{font-size:13.5px;color:var(--ink-soft);margin:0}
  .note{font-size:12.5px;font-weight:600;color:var(--accent-ink);margin:0}
  .howto{font-size:12.5px;color:var(--muted);margin:0}
  .howto b{color:var(--ink-soft)}
  .cue{margin-top:auto;padding-top:2px;font-size:12.5px;font-weight:650;color:var(--accent-ink)}
  /* detail view */
  .backbtn{border:none;background:none;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
  .backbtn:hover{color:var(--accent-ink)}
  #detail h2{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:6px 0 8px;display:flex;align-items:center;gap:8px}
  #detail .desc{font-size:16px;max-width:64ch}
  .avail{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:20px 0}
  .avail .cat{margin:0;padding:10px 16px;background:var(--surface-2)}
  .avail ul{list-style:none;margin:0;padding:0}
  .avail li{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px;border-top:1px solid var(--line)}
  .avail li .inc{color:var(--good);font-weight:650}.avail li .up{color:var(--warn);font-weight:650}
  .steps{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:10px}
  .steps li{display:flex;gap:12px;align-items:flex-start}
  .steps .num{flex:none;width:24px;height:24px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:12px;display:grid;place-items:center;margin-top:1px}
  #detail .bullets{margin:0 0 6px;padding-left:20px;font-size:14px;color:var(--ink-soft)}
  #detail .bullets li{margin:4px 0}
  .ctrls{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:2px 0 6px}
  .ctrl{display:grid;grid-template-columns:1fr;gap:2px;padding:11px 16px;border-top:1px solid var(--line)}
  .ctrl:first-child{border-top:none}
  @media(min-width:640px){.ctrl{grid-template-columns:minmax(140px,210px) 1fr;gap:14px}}
  .clabel{font-size:14px;font-weight:650;color:var(--ink)}
  .cdoes{font-size:13.5px;color:var(--ink-soft)}
  .task{margin:0 0 14px}
  .ttitle{font-size:14px;font-weight:650;margin:0 0 6px}
  #detail h3.cat{margin-top:24px}
  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--muted)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="wrap">
  <header class="mast">
    <span class="brand"><span class="dot">wx</span>wxKanban</span>
    <h1>Help — what each plan includes</h1>
    <p class="lede">Every wxKanban area, what it does, and whether it's included on each plan. Pick a plan to see what's available and what an upgrade unlocks — or open any feature for step-by-step help.</p>
  </header>
  <div id="main">
    <div class="tiers" id="tiers"></div>
    <div class="legend">
      <span><span class="dot2" style="background:var(--good)"></span>Included</span>
      <span><span class="dot2" style="background:var(--warn)"></span>Upgrade required</span>
    </div>
    <div id="catalog"></div>
  </div>
  <div id="detail" style="display:none"></div>
  <footer><span>wxKanban Help</span><span><a href="https://www.wxperts.com">www.wxperts.com</a></span></footer>
</div>
<script>window.__HELP__={"plans":[{"id":"SINGLE_USER","order":1,"label":"Single User","price":"$19.95/mo","userLimit":"1 user","tagline":"Solo, entry-level"},{"id":"SMALL_BUSINESS","order":2,"label":"Small/Medium Business","price":"$29.95/mo","userLimit":"Up to 5 users","tagline":"Small teams, compliance-ready"},{"id":"CONSULTANT","order":3,"label":"Consultant","price":"$39.95/mo","userLimit":"Unlimited team","tagline":"Billable client work"},{"id":"ENTERPRISE","order":4,"label":"Enterprise","price":"$59.95/mo","userLimit":"25+ users","tagline":"Scale, security, SLA"}],"categories":["Core workspace","Development lifecycle","Integrations","Team & collaboration","Time, billing & consulting","Admin & configuration","Security & compliance","Enterprise & support"],"categoryLabels":{"Core workspace":"Core workspace","Development lifecycle":"Development lifecycle","Integrations":"Integrations","Team & collaboration":"Team & collaboration","Time, billing & consulting":"Time, billing & consulting","Admin & configuration":"Admin & configuration","Security & compliance":"Security & compliance","Enterprise & support":"Enterprise & support"},"features":[{"id":"dashboard","category":"Core workspace","title":"Dashboard","description":"Your project overview — lifecycle-phase progress per project plus quick links to each project's generated documents.","howTo":"Open Dashboard from the sidebar. Each project card shows its phase progress and document links; ADMINs get a New button to create a project inline.","minPlan":"SINGLE_USER"},{"id":"projects","category":"Core workspace","title":"Projects","description":"Create and manage projects. Unlimited projects on every paid plan.","howTo":"Create a project from the dashboard New button or the Projects nav, then open it to see its tabs (overview, lifecycle, tasks).","minPlan":"SINGLE_USER"},{"id":"tasks","category":"Core workspace","title":"My Tasks (Kanban)","description":"Your assigned work on a Kanban board across projects.","howTo":"Open My Tasks; drag cards between columns to change status, or open a card for detail.","minPlan":"SINGLE_USER"},{"id":"settings","category":"Core workspace","title":"Settings","description":"Account, company, and preference settings, including language.","howTo":"Open Settings from the nav; the language switcher and profile live here.","minPlan":"SINGLE_USER"},{"id":"faq","category":"Core workspace","title":"FAQ","description":"Answers to common questions about using wxKanban.","howTo":"Open FAQ from the nav.","minPlan":"SINGLE_USER"},{"id":"lifecycle","category":"Development lifecycle","title":"6-Phase Lifecycle & Orchestrator","description":"The Design → Implementation → QA → Human Testing → Beta → Release methodology that gates every feature and keeps a single source of truth for where a project stands.","howTo":"Drive it from Claude Code + the wxKanban kit in VS Code (buildscope → createSpecs → implement). The right command is available only at the right phase.","minPlan":"SINGLE_USER"},{"id":"specs","category":"Development lifecycle","title":"Specs & Scopes","description":"Scope-of-project documents and the generated specs, plans, and tasks for each feature.","howTo":"Author a scope with buildscope; generate the spec/plan/tasks with createSpecs; track them in the Cockpit.","minPlan":"SINGLE_USER"},{"id":"audit","category":"Development lifecycle","title":"Audit Reports","description":"A per-release audit trail of what was built, tested, and code-fenced.","howTo":"Open the Audit Report link on a project card, or regenerate it from the Admin dashboard.","minPlan":"SINGLE_USER"},{"id":"cockpit","category":"Development lifecycle","title":"Dev Cockpit","description":"A VS Code sidebar showing remaining work per scope, live as work is built.","howTo":"Install the Dev Cockpit extension; it pins your active scope and lists incomplete tasks.","minPlan":"SINGLE_USER"},{"id":"test-suite","category":"Development lifecycle","title":"Test Suite","description":"Automated tests es.","howTo":"Open Invoices, pick a project and date range, and generate; invoiced entries are marked to prevent duplicates.","minPlan":"CONSULTANT"},{"id":"reports","category":"Time, billing & consulting","title":"Reports","description":"Advanced reporting across time, projects, and outcomes.","howTo":"Open Reports from the nav.","minPlan":"CONSULTANT"},{"id":"workHub","category":"Time, billing & consulting","title":"Work Hub","description":"A consultant engagement hub for managing client work.","howTo":"Open Work Hub to see and manage your engagements.","minPlan":"CONSULTANT"},{"id":"clientPortal","category":"Time, billing & consulting","title":"Client Portal","description":"Give clients a scoped, read-only view of their project.","howTo":"Enable the portal for a project and share the client link.","minPlan":"CONSULTANT"},{"id":"customWorkflows","category":"Time, billing & consulting","title":"Custom Workflows","description":"Tailor lifecycle workflows to your team's process.","howTo":"Configure custom workflows in project settings.","minPlan":"CONSULTANT"},{"id":"apiAccess","category":"Time, billing & consulting","title":"API Access","description":"Programmatic access to your wxKanban data via API.","howTo":"Create an API token in Settings and call the documented endpoints.","minPlan":"CONSULTANT"},{"id":"stackProfiles","category":"Admin & configuration","title":"Stack Profiles","description":"Reusable target-stack and style definitions applied when a project is created.","howTo":"Open Stack Profiles (Admin) to define or edit your company's stacks.","minPlan":"SINGLE_USER","adminOnly":true},{"id":"themeProfiles","category":"Admin & configuration","title":"Theme Profiles","description":"Reusable look-and-feel themes for generated output.","howTo":"Open Theme Profiles (Admin) to define or edit themes.","minPlan":"SINGLE_USER","adminOnly":true},{"id":"encryption","category":"Security & compliance","title":"Encryption at rest","description":"Secrets are encrypted at rest with AES-256-GCM.","howTo":"Always on — no configuration required.","minPlan":"SINGLE_USER"},{"id":"soc2","category":"Security & compliance","title":"SOC 2 & HIPAA","description":"SOC 2- and HIPAA-aligned controls and compliance tooling.","howTo":"Add your company's SDLC documents for compliance analysis; assign controls to team members.","minPlan":"SMALL_BUSINESS"},{"id":"sso","category":"Security & compliance","title":"Single Sign-On (SSO)","description":"Enterprise SSO for your organization.","howTo":"Contact your wxKanban representative to configure your identity provider.","minPlan":"ENTERPRISE"},{"id":"advancedSecurity","category":"Security & compliance","title":"Advanced Security","description":"Additional enterprise-grade security controls.","howTo":"Configured as part of Enterprise onboarding.","minPlan":"ENTERPRISE"},{"id":"emailSupport","category":"Enterprise & support","title":"Email Support","description":"Email-based product support.","howTo":"Email admin@wxperts.com.","minPlan":"SINGLE_USER"},{"id":"dedicatedSupport","category":"Enterprise & support","title":"Dedicated Support","description":"A dedicated support contact for your account.","howTo":"Assigned during Enterprise onboarding.","minPlan":"ENTERPRISE"},{"id":"customIntegrations","category":"Enterprise & support","title":"Custom Integrations","description":"Bespoke integrations built for your organization.","howTo":"Scope custom integrations with your wxKanban representative.","minPlan":"ENTERPRISE"},{"id":"sla","category":"Enterprise & support","title":"SLA Guarantee","description":"A contractual uptime and response-time SLA.","howTo":"Part of your Enterprise agreement.","minPlan":"ENTERPRISE"}],"guides":{"dashboard":["Open Dashboard from the left sidebar.","Each project card shows its current lifecycle phase and a progress bar.","Use the document links on a card — Overview, Lifecycle, Audit — to open the generated reports.","ADMINs: click New to create a project inline."],"projects":["Create a project from the Dashboard New button or the Projects nav.","Open a project to see its tabs: overview, lifecycle, and tasks.","Projects are unlimited on every paid plan — organize work into as many as you need."],"tasks":["Open My Tasks from the nav.","Cards are grouped into status columns; drag a card to change its status.","Click a card to open its detail, comments, and the spec/task it links to."],"settings":["Open Settings from the nav.","Update your profile and preferences; switch language with the language selector.","Company ADMINs manage company-wide settings from here."],"faq":["Open FAQ from the nav.","Browse or search common questions.","Follow the linked docs for deeper guidance."],"lifecycle":["Install the wxKanban kit and the Dev Cockpit in VS Code.","Run /buildscope to define a scope, then /createSpecs to generate the spec, plan, and tasks.","Run /implement to build tasks, then advance the phases (QA → Human Testing → Beta → Release) as each gate passes.","The Cockpit shows which command is available at the current phase."],"specs":["Author a scope with /buildscope — it interviews you section by section.","Generate the spec, plan, and tasks with /createSpecs.","Track progress in the Dev Cockpit; each task links back to its spec."],"audit":["Open the Audit Report link on a project card, or regenerate it from the Admin dashboard.","Review what was built, tested, and code-fenced for the release.","Keep it as your compliance and traceability record."],"cockpit":["Install the “wxKanban Dev Cockpit” VS Code extension (from the VSIX).","Open the wxKanban icon in the activity bar.","Your active scope is pinned and incomplete tasks are listed live as you build."],"pmIntegrations":["Open PM Integrations from the nav.","Connect a provider — Jira, Monday.com, Asana, or Trello — via OAuth.","Tasks sync on a background schedule; conflicts resolve last-write-wins (wxKanban wins).","Single User and Small Business get one connection; Consultant and up get multiple."],"team":["Open Team from the nav (Small Business plan or higher).","Invite a teammate by email and assign their role.","Manage access and remove members as needed.","Seat limits: 5 (Small Business), unlimited (Consultant), 25+ (Enterprise)."],"timeTracking":["On the Consultant plan or higher, open a task and start the timer.","Mark entries billable so they flow into invoicing.","Review and edit time entries; the timer prompts you if it runs past 8 hours."],"invoices":["On the Consultant plan or higher, open Invoices from the nav.","Pick a project and a date range of billable time.","Generate the PDF; invoiced entries are marked to prevent duplicate billing."],"reports":["On the Consultant plan or higher, open Reports from the nav.","Choose a report and its filters (time, project, outcomes).","Review or export the results."],"workHub":["On the Consultant plan or higher, open Work Hub from the nav.","See your client engagements and their status.","Open an engagement to manage its work and billing."],"clientPortal":["On the Consultant plan or higher, enable the portal for a project.","Share the client link; clients get a scoped, read-only view."],"customWorkflows":["On the Consultant plan or higher, open project settings.","Configure workflow stages to match your team's process."],"apiAccess":["On the Consultant plan or higher, open Settings and create an API token.","Call the documented endpoints with the token as a Bearer header.","Revoke any tokens you no longer need."],"stackProfiles":["As an ADMIN, open Stack Profiles from the admin nav.","Define or edit a target stack and style — it's applied when a project is created."],"themeProfiles":["As an ADMIN, open Theme Profiles from the admin nav.","Define or edit a look-and-feel theme for generated output."],"encryption":["Nothing to do — secrets are encrypted at rest with AES-256-GCM automatically."],"soc2":["On the Small Business plan or higher, add your company's SDLC documents for compliance analysis.","Assign controls to team members.","Use the AI compliance checks to confirm you meet audit requirements."],"sso":["On Enterprise, contact your wxKanban representative to configure your identity provider.","Once set up, your team signs in through SSO."],"advancedSecurity":["Configured during Enterprise onboarding — there's no self-serve setup."],"emailSupport":["Email admin@wxperts.com with your question.","Include your account or company name for faster help."],"dedicatedSupport":["On Enterprise, your dedicated contact is assigned during onboarding — reach out to them directly."],"customIntegrations":["On Enterprise, scope the integration with your wxKanban representative."],"sla":["On Enterprise, your uptime and response-time SLA is part of your agreement — see your contract."]},"articles":{"dashboard":{"overview":"The dashboard is your landing page after signing in and adapts to your role. Admins get the Admin Dashboard (subscription status, org stats, a project overview grid with per-project document links, proposals, pending tasks, activity feed, and system health), while team members get a leaner My Dashboard focused on assigned projects, open tasks, and a link to their work queue. Several lower sections (Time & Billing, Reports) are placeholders that only show data once time entries exist and require the right plan and admin role.","whatYouSee":["Page header with your plan, company name, and welcome message","Stat cards across the top (Team Members / Assigned Projects, Active Projects / Open Tasks, Hours This Week)","Subscription card showing your current billing plan (admin)","Project Overview grid — cards grouped into Active and Branched, each with lifecycle phase progress","Per-project document links inside each project card (Overview, Lifecycle, Development Plan, Audit Report, Compound Learnings, Scope Analysis, Entity Diagram)","Project Proposals and Pending Tasks panels (admin)","Engagements quick-view (admin, hidden when you have none)","Daily Digest preview and Activity feed (admin)","Time & Billing, System Health, and Reports sections (admin, plan-gated placeholders)","Consultant Work Hub card with a link to your task queue (team member)"],"controls":[{"label":"New","does":"Opens the Create Project modal to add a project inline from the dashboard.","adminOnly":true},{"label":"All projects","does":"Link in the project panel header that takes you to the full Projects list."},{"label":"Edit pencil (on a project card)","does":"Opens the Edit Audit Type dialog to set or clear a project's compliance framework (GDPR, HIPAA, HITRUST, SOC2).","adminOnly":true},{"label":"Project card","does":"Clicking a project card opens that project's workspace."},{"label":"Project Overview (card link)","does":"Opens the AI-assisted project overview editor for that project, creating a draft if none exists."},{"label":"Project Lifecycle (card link)","does":"Opens the generated project lifecycle document/PDF for that project."},{"label":"Development Plan (card link)","does":"Opens the generated build-roadmap (development plan) PDF for that project."},{"label":"Audit Report (card link)","does":"Opens the project's compliance audit report page."},{"label":"Compound Learnings (card link)","does":"Opens the project's Learnings report showing captured decisions and fixes."},{"label":"Project Scope Analysis (card link)","does":"Opens the cross-scope analysis report for the project."},{"label":"Entity Diagram (card link)","does":"Opens the platform-wide database ER diagram viewer."},{"label":"Compliance Framework (dropdown in Edit Audit Type)","does":"Selects which audit framework applies to the project, then Save applies it.","adminOnly":true},{"label":"Open Work Hub","does":"Team-member button that opens the Consultant Work Hub — your unified task queue with time tracking."}],"tasks":[{"title":"Create a new project from the dashboard","steps":["Click New in the Project Overview panel header","Fill in the project details in the modal","Confirm to create — you are taken to the new project"]},{"title":"Set a project's compliance framework","steps":["Find the project card","Click the edit pencil next to its audit badge","Choose a framework (or None) in the dropdown","Click Save"]},{"title":"Open a project's lifecycle or development plan","steps":["Locate the project card in the grid","Click the Project Lifecycle or Development Plan link inside the card","The generated PDF opens"]}],"tips":["Team members see a read-only project grid with no New button or edit pencils.","Hours This Week and the Time & Billing / Reports sections are placeholders and show zero/empty until time entries are recorded.","A document link that says 'not created' means that report hasn't been generated for the project yet.","Time & Billing, Reports, and System Health require the CONSULTANT+ plan and/or admin role."]},"projects":{"overview":"The Projects area lists all your projects with search, phase filters, and sorting, and lets you open any project into a full workspace. The project workspace is organized as a 6-phase lifecycle (Design, Implementation, QA, Human Testing, Beta, Release) plus extra tabs for Lifecycle, Development Plan, Portfolio Analyzer, Compliance, Learnings, and Kit, and a Views row (Matrix, Kanban, Stack, Theme, Bug Reports). Admins can edit, archive, or delete projects and control phase advancement.","whatYouSee":["Projects list header with a count and New Project button","Phase filter chips (All, Design, Implementation, QA Testing, Human Testing, Beta Release, Release)","Search box and sort buttons (Updated, Created, Name)","A row of project cards; clicking one expands its detail panel","Inside a project: a top bar with project name, phase badge, and edit/archive/delete controls","Tab bar: Lifecycle, Development Plan, Portfolio Analyzer, Compliance, Learnings, Kit","A Views row: Matrix, Kanban, Stack, Theme, Bug Reports","The active phase workspace (specs, tasks, completion, advance/reopen controls)","A task drawer that slides in when you open a specific task"],"controls":[{"label":"New Project","does":"Opens the Create Project modal to start a new project."},{"label":"Show All / My Projects","does":"Toggles between only your assigned projects and all projects in your organization (shown only to non-admins; admins always see everything)."},{"label":"Phase filter chips","does":"Filters the list to projects currently in the selected lifecycle phase."},{"label":"Search box","does":"Filters projects by name or description as you type."},{"label":"Sort buttons (Updated / Created / Name)","does":"Sorts the list by that field; clicking the active field again flips ascending/descending."},{"label":"Edit pencil (project top bar)","does":"Opens the edit dialog to change name, description, hourly rate, allocated hours, PM systems, security classification, audit type, and phase assignments."},{"label":"Audit dropdown (project top bar)","does":"Quickly sets the project's compliance framework (No Audit, GDPR, HIPAA, HITRUST, SOC2).","adminOnly":true},{"label":"Archive","does":"Archives the project so it is hidden from the project list (with a confirmation prompt).","adminOnly":true},{"label":"Delete","does":"Permanently deletes the project and all its tasks, phases, specs, and documents (with a confirmation prompt).","adminOnly":true},{"label":"Lifecycle / Development Plan tabs","does":"Show the generated lifecycle PDF and build-roadmap PDF for the project inline."},{"label":"Compliance tab","does":"Opens the compliance workspace with sub-tabs: Settings, Documents, Tasks, Audit, Reports."},{"label":"Learnings tab","does":"Shows the captured learnings report; admins can regenerate it."},{"label":"Kit tab","does":"Opens Kit management for downloading and managing the project's orchestrator kit."},{"label":"Change Impact mode (Kit tab)","does":"Sets how the kit's Change Impact check treats AI edits in this project: Notify tells the developer what an edit affects and never asks; Boundaries (the default) asks only when an edit reaches another scope or a signed-off test; Always asks whenever an edit affects anything else. It applies to every developer's kit and overrides a value set locally. Possible data loss is stopped in every mode. Only the project owner or a company administrator can change it; everyone else sees who set it and when."},{"label":"Change Impact log (expanded scope row)","does":"Expand a scope to see its Change Impact log: a read-only record of each change that crossed an Impact Boundary for that scope, who agreed to or approved it, when, and the developer's own words. Records cannot be edited or deleted."},{"label":"Matrix / Kanban views","does":"Switch the workspace between a scope matrix grid and a Kanban board of scopes/tasks."},{"label":"Stack / Theme / Bug Reports views","does":"Open the project's tech stack editor, visual theme studio, and bug-report triage surfaces."}],"tasks":[{"title":"Find and open a project","steps":["Go to the Projects list","Type in the search box or click a phase filter chip","Click a project card to expand it, then open its workspace"]},{"title":"Move a project to the next phase","steps":["Open the project and select the current phase tab","Complete the phase's tasks or specs","Use the Advance control in the phase view (admins or the phase's assignee)"]},{"title":"Edit project details and phase owners","steps":["Open the project","Click the edit pencil in the top bar","Update fields and assign team members to phases","Save"]},{"title":"Enable a compliance framework","steps":["Open the project","Pick a framework from the Audit dropdown (admin) or the edit dialog","Open the Compliance tab to configure settings, upload documents, and run audits"]},{"title":"Choose how the kit checks AI edits","steps":["Open the project and click the Kit tab","In Change Impact mode, choose Notify, Boundaries or Always (project owner or company administrator)","Check the line under the choices: it shows who set the mode and when; every developer's kit picks it up within an hour"]}],"tips":["Opening a bare project URL lands on the Kanban board by default.","Change Impact mode set here wins over a mode a developer typed into their own kit settings; the kit tells them it was ignored.","Only admins (or the assigned phase owner / team manager) can advance or reopen a phase.","Delete is permanent and cannot be undone; use Archive to just hide a project.","Projects accessed through a client engagement show a 'Client project' badge and hide the edit controls.","The Lifecycle and Development Plan PDFs can lag recent changes until regenerated."]},"tasks":{"overview":"The Tasks page shows a unified, read-only view of all tasks aggregated from your connected project-management systems (Jira, Monday, Asana, Trello) plus internal tasks. You can filter, sort, and manually trigger a sync, but tasks are viewed here rather than created or edited.","whatYouSee":["Header with page title and a badge showing the total task count","Last-sync time and a Sync Now button","Filter/sort bar: Source, Priority, Status, Sort field, and sort-direction toggle","A responsive grid of task cards (title, source badge, project, priority, status, due date, external id)","Empty-state prompt linking to Integrations when no tasks exist"],"controls":[{"label":"← Back","does":"Returns to the Dashboard."},{"label":"Sync Now","does":"Triggers an immediate sync of all connected PM systems, then reports how many tasks were added, updated, or errored and refreshes the list."},{"label":"Source (dropdown)","does":"Filters tasks by origin: All sources, Jira, Monday, Asana, Trello, or Internal."},{"label":"Priority (dropdown)","does":"Filters tasks by priority: All, Critical, High, Medium, or Low."},{"label":"Status (dropdown)","does":"Filters tasks by status: All, Open, In Progress, Completed, or Orphaned."},{"label":"Sort (dropdown)","does":"Chooses the sort field: Last Updated, Due Date, Priority, or Title."},{"label":"↑ / ↓ (direction toggle)","does":"Switches the sort order between ascending and descending."},{"label":"Integrations (link)","does":"In the empty state, navigates to the Integrations page to connect a PM system."}],"tasks":[{"title":"See tasks from a specific tool","steps":["Open the Tasks page","Set the Source dropdown to Jira, Monday, Asana, Trello, or Internal","Review the filtered cards"]},{"title":"Pull the latest tasks","steps":["Click Sync Now","Wait for the spinner to finish","Read the summary of added/updated/errors and the refreshed cards"]},{"title":"Focus on urgent work","steps":["Set Priority to Critical or High","Set Sort to Due Date","Toggle the direction to ascending to see soonest due dates first"]}],"tips":["The count badge reflects the currently filtered result set.","Tasks are read-only here; connect or manage sources on the Integrations page.","Last sync shows a relative time (e.g. '5m ago') based on the most recent connection sync."]},"pmIntegrations":{"overview":"The Integrations page lets you connect your project-management tools to wxKanban via OAuth so their tasks flow into the unified Tasks view. It shows one card per supported system (Jira, Monday.com, Asana, Trello) with connect/disconnect controls and connection status.","whatYouSee":["Header with title, subtitle, and a View Tasks button","Optional green success banner after returning from an OAuth flow","Optional red error banner if a connection action fails","A grid of four PM-system cards (Jira, Monday.com, Asana, Trello)","Per-card status: connected-since date, sync status badge (active/expired/failed), and last-sync time","A blue 'Need help?' info panel at the bottom"],"controls":[{"label":"← Back","does":"Returns to the Dashboard."},{"label":"View Tasks","does":"Navigates to the Tasks page to see synced tasks."},{"label":"Connect","does":"Starts the OAuth authorization flow for that system and redirects you to its login/consent page."},{"label":"Disconnect","does":"After a confirmation prompt, removes the connection to that PM system and refreshes the cards."},{"label":"Sync status badge","does":"Displays the connection health: Active (green), or a warning for Expired (yellow) / Failed (red)."},{"label":"Need help? panel","does":"Static informational text with guidance on connecting integrations."}],"tasks":[{"title":"Connect a PM tool","steps":["Open the Integrations page","Find the system's card (e.g. Jira)","Click Connect","Complete the sign-in/consent on the provider's site","Return to see a success banner and Connected status"]},{"title":"Remove a connection","steps":["Locate the connected system's card","Click Disconnect","Confirm in the prompt"]},{"title":"Check why syncing stopped","steps":["Open the Integrations page","Look at the card's status badge","If it shows Expired or Failed, Disconnect and Connect again to re-authorize"]}],"tips":["Only Jira, Monday.com, Asana, and Trello are supported.","An Expired or Failed badge usually means the OAuth token needs re-authorizing via Connect.","After connecting, use View Tasks (or Sync Now on the Tasks page) to pull tasks in."]},"team":{"overview":"The Team Members page (Personnel) lists everyone in your company, with search, active/inactive filtering, and — for admins — controls to invite members, change roles and language, activate/deactivate, remove, re-invite, and reset passwords. Admins also see a Pending Invitations table and a Consultants panel.","whatYouSee":["Header with 'Team Members' title, member count, and an Invite Member button","Search box plus All / Active / Inactive filter buttons","Members table: Email, Name, Role, Language, Status, Joined, Actions","Inline error banner and a green action-steps confirmation panel","Pending Invitations table (admin-only, when invitations exist)","Consultants panel for engaged consulting companies (spec 037)"],"controls":[{"label":"Invite Member","does":"Opens the Invite Team Member modal to send an email invitation with a chosen role."},{"label":"Search by name or email","does":"Filters the member list as you type."},{"label":"All / Active / Inactive","does":"Filters the table to all members, only active, or only inactive."},{"label":"Edit name (pencil)","does":"Inline-edits the member's full name; save with the check, cancel with the X (Enter/Escape also work)."},{"label":"Role (dropdown)","does":"Changes a member's role to Admin, Manager, or Member.","adminOnly":true},{"label":"Language (dropdown)","does":"Sets the member's preferred UI language from the supported locales.","adminOnly":true},{"label":"Active / Inactive (status toggle)","does":"Deactivates (with a confirm) or reactivates a member's access.","adminOnly":true},{"label":"Re-send invitation (mail icon)","does":"Sends a fresh invitation email to a member and shows the resulting steps.","adminOnly":true},{"label":"Reset password (key icon)","does":"Sends a password-reset email to the member.","adminOnly":true},{"label":"Remove member (trash icon)","does":"After a Yes/No confirm, removes the member (deactivates their access).","adminOnly":true},{"label":"Resend invitation (Pending table)","does":"Reissues a pending invite with a new link and fresh 7-day expiry.","adminOnly":true},{"label":"Cancel invitation (Pending table)","does":"After confirm, cancels a pending invitation so it can no longer be accepted.","adminOnly":true},{"label":"Role radios (invite modal)","does":"Choose Admin, Team Manager, or Team Member for the invitee; Team Manager requires a CONSULTANT+ plan."},{"label":"Send Invitation (invite modal)","does":"Sends the invite to the entered email; shows a success panel with a 7-day accept window."}],"tasks":[{"title":"Invite a new team member","steps":["Click Invite Member","Enter the person's email","Pick a role (Admin, Team Manager, or Team Member)","Click Send Invitation","The invitee gets an email and has 7 days to accept"]},{"title":"Change someone's role","steps":["Find the member in the table","Open the Role dropdown in their row","Select Admin, Manager, or Member"]},{"title":"Deactivate an account","steps":["Locate the member","Click their green Active badge","Confirm 'Set inactive?' with Yes"]},{"title":"Resend a stale invitation","steps":["Scroll to Pending Invitations","Click the mail icon on the invite row to resend with a fresh 7-day expiry"]}],"tips":["Role, language, status toggle, re-invite, reset-password, remove, and the Pending Invitations table are visible only to admins.","Admins cannot change status or role on other admins, or on themselves.","Seat limits apply: at the plan's cap the invite form is disabled with an upgrade prompt, and Team Manager needs a CONSULTANT or ENTERPRISE plan.","Deactivate/remove/cancel actions each require a Yes/No confirmation."]},"timeTracking":{"overview":"There is no dedicated Time Tracking page wired into the app. Live time tracking happens inside the Consultant Work Hub (see workHub). A set of standalone time-tracking widgets exists in the codebase (TimerWidget, TimeEntriesList, TimeSummary) that hit the /api/time-tracking endpoints, but they are not currently mounted on any route, so this feature is partially built / not user-reachable as its own screen. The controls below describe those widgets for completeness.","whatYouSee":["Timer widget: a start/stop stopwatch that shows elapsed HH:MM:SS while running (unmounted component)","Time entries list: past entries with duration, start/end, billable and invoiced badges (unmounted component)","Time summary: total time, billable time, billable percentage and per-entry averages (unmounted component)"],"controls":[{"label":"Description (optional)","does":"Free-text note (max 500 chars) for what you are working on before starting the timer"},{"label":"Mark as billable","does":"Checkbox that sets the new time entry as billable when you start the timer"},{"label":"Start Timer","does":"Starts a live timer for the project/task; blocked if a timer is already running"},{"label":"Stop Timer","does":"Stops the running timer and records the elapsed duration as a time entry"},{"label":"Billable only","does":"Checkbox filter that shows only billable entries in the time entries list"},{"label":"Delete","does":"Removes a time entry; disabled once the entry has been invoiced"}],"tasks":[{"title":"Track time on work (via Work Hub)","steps":["Open the Consultant Work Hub","Press Start Timer on the task you are working on","Press Stop when done and answer the billable prompt"]}],"tips":["A timer running past 8 hours triggers an inactivity warning prompting you to stop it","Only one timer can run at a time"]},"invoices":{"overview":"Full working invoicing screen. Shows summary stats, lets you generate an invoice from time entries in a date range, then view, download, email, resend, or delete each invoice.","whatYouSee":["Header with title and a Generate Invoice button","Three stat cards: Total Invoices, Total Revenue, Invoices Sent","Invoice history table: number, date, billed-to, hours, amount, status (Sent/Draft), and row actions","Generate modal (date range) and a per-invoice detail modal"],"controls":[{"label":"Generate Invoice (+)","does":"Opens the generate modal to create an invoice for a date range"},{"label":"Start Date / End Date","does":"Date pickers in the modal that define which time entries are billed (default rate is $100/hr)"},{"label":"Generate Invoice (confirm)","does":"Creates the invoice from billable time in the chosen range; disabled until both dates are set"},{"label":"Cancel","does":"Closes the generate modal without creating an invoice"},{"label":"View (eye icon)","does":"Opens the invoice detail modal with billed-to, status, hours, and total"},{"label":"Send (paper-plane icon)","does":"Emails the invoice and marks it Sent; only shown on unsent invoices"},{"label":"Delete (trash icon)","does":"Deletes the invoice; disabled once the invoice has been sent"},{"label":"Download PDF","does":"Opens the invoice PDF in a new tab (detail modal)"},{"label":"Send Invoice","does":"Emails an unsent invoice from the detail modal"},{"label":"Resend","does":"Re-sends an already-sent invoice from the detail modal"}],"tasks":[{"title":"Generate an invoice","steps":["Click Generate Invoice","Pick a start and end date","Click Generate Invoice to confirm"]},{"title":"Send an invoice","steps":["Find the invoice in the history table","Click the send (paper-plane) icon, or open View and click Send Invoice"]}],"tips":["Sent invoices cannot be deleted","Status badge is green for Sent, yellow for Draft"]},"reports":{"overview":"Reporting screen with two tabs: Time report (hours per team member for a date range) and Projects report (per-project performance). Data is real; the CSV export button is a stub and does not yet produce a file.","whatYouSee":["Two tabs: Time and Projects","Time tab: a date-range filter card plus a per-member table (member, total hours, billable hours, billable %)","Projects tab: a table of projects (hours, task count, completion-rate bar, team size)"],"controls":[{"label":"Time (tab)","does":"Shows hours logged per team member for the selected date range"},{"label":"Projects (tab)","does":"Shows per-project performance: hours, tasks, completion, team size"},{"label":"Start Date / End Date","does":"Date pickers; the time report only loads once both dates are set"},{"label":"Export CSV","does":"Intended to export the report to CSV, but is currently not implemented (no download)"}],"tasks":[{"title":"See time by team member","steps":["Open the Time tab","Set a start and end date","Review the per-member hours and billable percentage"]},{"title":"Review project performance","steps":["Open the Projects tab","Read the hours, task count, and completion rate per project"]}],"tips":["Billable % badge is green above 80%, yellow below","The time report stays empty until both dates are chosen"]},"workHub":{"overview":"The Consultant Work Hub is the consultant's daily workspace: an assigned-task queue with a built-in stopwatch timer, workload counters, billable-time preview, and compliance flags. Fully built and the primary place time gets tracked.","whatYouSee":["Header with a project filter dropdown","Green running-timer banner (when a timer is active) and an amber 8-hour inactivity warning","Workload summary bar: Total, Past Due, 30+ day Aging, Compliance Attention counts","Assigned-queue list: each task shows name, project, status, priority, source tags, and action buttons","Billable preview panel with a date range, manual/AI source breakdown, and a compliance review list"],"controls":[{"label":"Project filter (dropdown)","does":"Filters the task queue and previews to All projects or one project"},{"label":"Start Timer (per task)","does":"Starts a billable timer on that task; disabled while another timer runs"},{"label":"Stop / Stop Timer","does":"Stops the running timer and opens the Save Time Entry (billable) prompt"},{"label":"Keep Running","does":"Dismisses the 8-hour inactivity warning and leaves the timer going"},{"label":"Activity","does":"Opens the Time Log drawer for the task: time entries, status-change history, and PM sync state"},{"label":"Blocked","does":"Opens the status modal to mark the task blocked (requires a reason)"},{"label":"Suspended","does":"Opens the status modal to mark the task suspended (requires a reason)"},{"label":"Billable / Non-billable (save prompt)","does":"After stopping a timer, sets whether the entry is billable, with optional notes"},{"label":"Save Entry","does":"Saves the stopped time entry with the chosen billable flag and notes"},{"label":"Invoice preview Start/End date","does":"Date inputs that set the range for the billable-time preview totals"}],"tasks":[{"title":"Track time on a task","steps":["Optionally filter by project","Click Start Timer on the task","Click Stop when done","Choose Billable or Non-billable and Save Entry"]},{"title":"Mark a task blocked or suspended","steps":["Click Blocked or Suspended on the task","Enter a required reason","Click Submit"]},{"title":"Preview billable time","steps":["Set the preview start and end dates","Read the entry count / total hours and the manual vs AI breakdown"]}],"tips":["Only one timer runs at a time; the green banner shows the active task and elapsed time","A reason is mandatory when marking a task blocked or suspended"]},"stackProfiles":{"overview":"Company Stack Profiles is an ADMIN-only screen that sets a company-wide default stack & style for each application type (Web / Desktop / Mobile). New projects of a type inherit the profile unless they capture their own stack, in which case the project's own stack always wins. There is one profile per type (max 3).","whatYouSee":["Page heading 'Company Stack Profiles' with an explanation that new projects inherit the company default per app type","A 'Promote a project's stack to company-wide' panel with a project dropdown and a Promote button","A 'Profiles' list showing one row per app type (Web / Desktop / Mobile), each showing whether it is Set (with last-updated date) or Not set","Non-admins see only a red 'This page requires Administrator access.' message"],"controls":[{"label":"Project (must have a captured Stack & Style)","does":"Dropdown of projects that have a captured stack; pick the one whose stack you want to make the company default. Only projects with an app type appear.","adminOnly":true},{"label":"Promote","does":"Copies the selected project's captured stack/style up to the company-wide profile for that project's app type. Disabled until a project is selected; shows 'Promoting…' while working.","adminOnly":true},{"label":"Clear","does":"Removes the company-wide stack profile for that app type, so projects of that type fall back to the built-in default. Shown on each row that is Set.","adminOnly":true},{"label":"Retry","does":"Re-loads the profiles list after a load error.","adminOnly":true}],"tasks":[{"title":"Make a project's stack the company default","steps":["Open Company Stack Profiles (admin)","In the Promote panel, choose a project that has a captured Stack & Style","Click Promote","Confirm the matching app-type row now shows 'Set'"]},{"title":"Reset an app type to the built-in default","steps":["Find the app-type row (Web / Desktop / Mobile) marked 'Set'","Click Clear on that row","The row returns to 'Not set' and projects of that type fall back to the wxKanban default"]}],"tips":["If no projects appear in the dropdown, run /buildstack on a project first to capture its Stack & Style.","A project that has its own captured stack ignores the company profile."]},"themeProfiles":{"overview":"Company Theme Profiles is an ADMIN-only screen that sets a company-wide default color theme per application type (Web / Desktop / Mobile). New projects inherit the theme unless they set their own; a project with its own theme always wins. Profiles are created from a project's Theme tab, not on this page.","whatYouSee":["Page heading 'Company Theme Profiles' with an explanation and a note to set a theme from a project's Theme tab via 'Save as company theme'","A 'Profiles' list with one row per app type (Web / Desktop / Mobile)","Each Set row shows a swatch preview of the primary / secondary / accent / background colors plus a last-updated date; unset rows read 'Not set (projects fall back to the wxKanban default)'","Non-admins see only a red 'This page requires Administrator access.' message"],"controls":[{"label":"Color swatches","does":"Read-only preview of the profile's primary, secondary, accent, and background colors for each Set app type.","adminOnly":true},{"label":"Clear","does":"Removes the company-wide theme profile for that app type, so projects of that type fall back to the wxKanban default theme. Shown on each Set row.","adminOnly":true},{"label":"Retry","does":"Re-loads the profiles list after a load error.","adminOnly":true}],"tasks":[{"title":"Set a company default theme","steps":["Open a project and go to its Theme tab","Choose 'Save as company theme'","Return to Company Theme Profiles to confirm the app-type row shows 'Set' with the swatch preview"]},{"title":"Remove a company theme","steps":["Find the app-type row marked 'Set'","Click Clear","The row returns to 'Not set' and projects fall back to the wxKanban default"]}],"tips":["There is no way to set a theme directly on this page — it is created from a project's Theme tab.","A project that sets its own theme overrides the company profile."]},"settings":{"overview":"There are two distinct Settings surfaces. The admin Company Settings page (src/client/pages/admin/SettingsPage.tsx) manages company info, billing/subscription, and arbitrary encrypted key/value application settings. A second account SettingsPage (src/client/pages/SettingsPage.tsx) is a tabbed personal/company screen with Company, Profile, Notifications, and Security tabs. Notifications is a stub ('coming soon'); Security's only live action is a (non-wired) Delete Account button, with password change living under Profile.","whatYouSee":["Admin Company Settings page: heading 'Company Settings', a Company Information editor (admin), a Billing & Subscription panel (admin), an 'Add Setting' form, and a 'Current Settings' list with a count","Account Settings page: a back-to-dashboard arrow, a Tier Info card with Upgrade, and a tab bar — Company (admins only), Profile, Notifications, Security","Company tab: company name, billing email, consultant invoice email, billing address, billing phone, Save Changes","Profile tab: read-only email, full name, timezone, language, an 'Enable time tracking' checkbox, Save Profile, plus a Change Password card","Notifications tab: placeholder 'Notification settings coming soon...'","Security tab: note pointing to Profile for password change, plus a Danger Zone Delete Account button"],"controls":[{"label":"Company Information — Save Company Info","does":"Saves company name, billing email, consultant invoice email, billing address, and phone via the admin settings API.","adminOnly":true},{"label":"Consultant Invoice Email","does":"Email where B2B invoices from engaged consulting companies are delivered; if empty, invoice generation fails.","adminOnly":true},{"label":"Update card / Re-activate subscription","does":"Opens the Stripe card form to re-enter a card and reactivate a failed/incomplete subscription (label reads 'Add a card / Subscribe' if none on file). Hidden when card processing is disabled.","adminOnly":true},{"label":"Add Setting form (Name / Type / Value / Description)","does":"Creates a new company setting. Name is snake_case (max 64); Type is boolean, default, report_header, or image, which changes the value input (dropdown / text / textarea / URL).","adminOnly":true},{"label":"Add Setting (button)","does":"Submits the new setting; shows 'Adding…' while saving.","adminOnly":true},{"label":"Setting row Edit (pencil)","does":"Inline-edits a setting's value and description; Save/Cancel, with Enter to save and Escape to cancel on text fields.","adminOnly":true},{"label":"Setting row Delete (trash)","does":"Prompts 'Delete this setting?' then Confirm/Cancel to remove it.","adminOnly":true},{"label":"Profile — Full Name / Timezone / Language / Enable time tracking","does":"Editable profile fields; changing Language live-applies the new locale. Email is shown but locked.","adminOnly":false},{"label":"Save Profile","does":"Persists the profile fields and updates the signed-in user context.","adminOnly":false},{"label":"Change Password (Current / New / Confirm + button)","does":"Changes the account password; validates min 8 chars, matching confirmation, and that the new password differs from the current.","adminOnly":false},{"label":"Upgrade (Tier Info card)","does":"Navigates to the /upgrade page to change plan tier.","adminOnly":false},{"label":"Delete Account (Security tab, Danger Zone)","does":"Presented as a destructive account-deletion button (no confirmation handler is wired in the component).","adminOnly":false}],"tasks":[{"title":"Update company billing details","steps":["Open admin Company Settings (or the account Settings Company tab)","Edit company name, billing email, consultant invoice email, address, phone","Click Save Company Info / Save Changes"]},{"title":"Recover a failed subscription","steps":["Open admin Company Settings","In Billing & Subscription review the plan and status","Click 'Update card / Re-activate subscription'","Enter card details in the Stripe form and complete"]},{"title":"Add a company setting","steps":["In Add Setting, enter a snake_case name","Pick a Type (boolean / default / report_header / image)","Enter the Value (and optional Description)","Click Add Setting"]},{"title":"Change your password","steps":["Open the account Settings Profile tab","In Change Password enter current, new (8+ chars) and confirm","Submit; new password must differ from the current one"]}],"tips":["Company settings are encrypted at rest.","The Notifications tab is a placeholder; password change is under Profile, not Security."]},"test-suite":{"overview":"Every version of a project is verified twice before it can be released. In the QA phase, AI runs the automated tests gate by gate and you watch the results arrive live. In the Human Testing phase, you run the tests only a person can judge and sign each one off yourself — but those stay locked until the automated run passes, so you are never asked to test a build that is already known to be broken. A version cannot reach production with either set outstanding.","whatYouSee":["A version header reading 'Version 1.4.0' with its status: In build, In UAT, In production, or Superseded","A 'Scope:' filter, so a project carrying a suite per scope answers 'what is outstanding for THIS scope' instead of showing a flat list of hundreds","Filter chips: All, Outstanding, Forced, Failing","Each test item marked Required or Optional, and tagged AI or Tester to show who wrote it","A 'Run <gate>' button per gate; while a run is open, totals update every couple of seconds as '12 passed · 1 failed · 20 total'","A note reading '4 user test(s) waiting for release to UAT' — the human set exists but cannot be acted on yet","In Human Testing before release: 'Not ready for you yet' with a count and an explanation","Once released: each test showing 'Before you start', 'Steps', and 'Check afterwards', with Pass and Fail buttons","Empty state: 'No test items yet. They are generated when the scope is implemented.'"],"controls":[{"label":"Run <gate>","does":"Starts the AI runner for every machine test in that gate and opens the live view. Results stream in while it works; if the runner stops reporting you see 'Run stalled — no report from the runner' rather than a spinner that never ends."},{"label":"Scope:","does":"Narrows the suite to one scope. Only that scope's items are fetched, which is what keeps a project with a hundred scopes responsive."},{"label":"All / Outstanding / Forced / Failing","does":"Filters the list. Outstanding is the working view; Failing is the triage view; Forced shows items whose testing requirement was overridden."},{"label":"Pass","does":"Signs the test off in your name. Your signoff is recorded against this version, not the project generally."},{"label":"Fail","does":"Asks what actually happened, then files a bug report with the test's steps already attached. The wording you enter becomes the report, so describe the behaviour rather than a guess at the cause."},{"label":"Add a test","does":"Adds your own test to the suite. It is tagged Tester rather than AI, so anyone reading the results can see a human wrote it."},{"label":"Testing requirement","does":"Turns the testing gate off for a project, or forces it on for one scope that inherits an off setting. Administrators only, and the change is written to the audit log.","adminOnly":true},{"label":"Inherits / Override","does":"Shows whether a scope follows the project's testing requirement or sets its own.","adminOnly":true}],"tasks":[{"title":"Run the automated tests for a version","steps":["Open the project and choose the QA phase","Set Scope: to the scope you care about, or leave it on all scopes","Click Run beside the gate you want","Watch the totals update; the list refreshes itself when the run finishes","Switch the filter to Failing to work through anything that did not pass"]},{"title":"Sign off a user test","steps":["Open the project and choose the Human Testing phase","If you see 'Not ready for you yet', the automated tests have not passed yet — nothing to do","Read 'Before you start', follow the Steps, then confirm 'Check afterwards'","Click Pass, or Fail and describe what actually happened","Repeat until no Required tests remain outstanding"]},{"title":"Handle a re-test request","steps":["Open Human Testing and look for 'Please test this again'","Something changed since your signoff, so it is being re-checked","Test it again and sign off as normal","If the change could not have affected what you verified, say why — your earlier signoff stands"]}],"tips":["The QA phase shows automated tests only. The user tests exist from the start and are shown as a waiting count, so you can see the work is there without being able to start it early.","A failure is more useful than a comment: it files a bug report with the steps attached, which a comment does not.","Optional tests do not block a release. Required ones do.","Turning the testing requirement off is an administrator action and is audit-logged; it does not delete the tests, it stops them gating the release."]},"feedback":{"overview":"You can report a problem or request a change from inside the product and then follow what happened to it. Feedback you submit is triaged, may be answered, and is visible to you afterwards under My Feedback. Failing a user test files a bug report the same way, with the test's steps already attached.","whatYouSee":["A feedback form asking what happened, with room for detail","My Feedback: your own submissions for the project you are working in, newest first","A status on each item showing where it has got to","Any reply or triage note left by whoever picked it up","Bug Reports for a project, where Resolved items are hidden by default","Status filter chips with counts, so you can see how many sit in each state"],"controls":[{"label":"Submit feedback","does":"Sends your report for triage. Describe what you did and what you saw rather than what you think caused it — the person reading it cannot see your screen."},{"label":"My Feedback","does":"Lists what you have submitted for the project you are currently in, with its status and any reply. It is scoped to that project, so feedback from another project will not appear here."},{"label":"Status filter chips","does":"Filters bug reports by state; each chip carries a count. Resolved is hidden by default so the list shows outstanding work."}],"tasks":[{"title":"Report a problem","steps":["Open the feedback form from inside the product","Describe what you did, what you expected, and what happened instead","Submit, then check My Feedback for the status and any reply"]},{"title":"Find out what happened to something you reported","steps":["Make sure you are in the project you reported it against","Open My Feedback","Find the item and read its status and any triage note"]}],"tips":["My Feedback is project-scoped. If something you reported is missing, check you are in the right project.","Failing a user test is the fastest way to file a good bug report — the steps are attached for you."]},"faq":{"overview":"Help & FAQ is available to any signed-in user (not admin-gated). It lists published, answered FAQs as an expandable accordion and lets you ask a new question that gets routed to be answered and added to the FAQ.","whatYouSee":["Page heading 'Help & FAQ' with a subtitle inviting you to browse or ask","A 'Frequently asked questions' card listing published FAQ entries, each a collapsible row","An 'Ask a question' area with a text box and Submit question button","Empty/loading states: 'Loading…' or 'No FAQs yet — ask a question below.'"],"controls":[{"label":"FAQ row (title)","does":"Click to expand/collapse the answer; a chevron rotates to show open state. Expanded answers may include an embedded video.","adminOnly":false},{"label":"Question text box","does":"Type your question (up to 2000 characters); must be at least 5 characters to submit.","adminOnly":false},{"label":"Submit question","does":"Sends your question to be answered and added to the FAQ; shows 'Sending…' then a confirmation message. Rejects questions under 5 characters.","adminOnly":false}],"tasks":[{"title":"Find an answer","steps":["Open Help & FAQ","Scan the FAQ list","Click a question to expand its answer (and watch any attached video)"]},{"title":"Ask a new question","steps":["Scroll to 'Didn't find your answer? Ask us'","Type your question (5+ characters)","Click Submit question and wait for the confirmation"]}],"tips":["Only published, answered FAQs appear — your submitted question is added once answered."]}},"ui":{"htmlLang":"en","pageTitle":"wxKanban Help — features by plan","h1":"Help — what each plan includes","lede":"Every wxKanban area, what it does, and whether it's included on each plan. Pick a plan to see what's available and what an upgrade unlocks — or open any feature for step-by-step help.","legendIncluded":"Included","legendUpgrade":"Upgrade required","included":"Included","notIncluded":"Not included","availableFromPre":"Available from the ","availableFromPost":" plan.","howToUseCue":"How to use it →","overview":"Overview","whatYoullSee":"What you'll see","controlsOptions":"Controls & options","commonTasks":"Common tasks","tips":"Tips","howToUseHeading":"How to use it","availabilityByPlan":"Availability by plan","backAllHelp":"← All Help","adminTag":"Admin","footer":"wxKanban Help","mdIntro":"What every wxKanban area does, and which subscription plan includes it. **✓** = included on that plan; **—** = not included (upgrade to the first plan where it shows ✓).","mdPlansHeading":"Plans","mdColUsers":"Users","mdColPrice":"Price","mdColBestFor":"Best for","mdColFeature":"Feature","mdAdminTag":"(ADMIN)"}};</script>
<script>
(function(){
  var D=window.__HELP__; var U=D.ui;
  var order={}; D.plans.forEach(function(p){order[p.id]=p.order});
  var sel=D.plans[0].id;
  function labelOf(id){var p=D.plans.find(function(x){return x.id===id});return p?p.label:id}
  function catLabel(c){return (D.categoryLabels&&D.categoryLabels[c])||c}
  function availAt(f,planId){
    if(order[planId]>=order[f.minPlan]) return {status:"inc",note:(f.planNotes||{})[planId]};
    return {status:"up",unlock:f.minPlan};
  }
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
  function feat(id){return D.features.find(function(f){return f.id===id})}
  function renderTiers(){
    var el=document.getElementById("tiers");el.innerHTML="";
    D.plans.forEach(function(p){
      var b=document.createElement("button");
      b.className="tier"+(p.id===sel?" active":"");
      b.setAttribute("aria-pressed",p.id===sel);
      b.innerHTML='<div class="name">'+esc(p.label)+'</div><div class="meta">'+esc(p.price)+' · '+esc(p.userLimit)+'</div>';
      b.onclick=function(){sel=p.id;renderList()};
      el.appendChild(b);
    });
  }
  function renderCatalog(){
    var root=document.getElementById("catalog");root.innerHTML="";
    D.categories.forEach(function(cat){
      var items=D.features.filter(function(f){return f.category===cat});
      if(!items.length)return;
      var h=document.createElement("div");h.className="cat";h.textContent=catLabel(cat);root.appendChild(h);
      var g=document.createElement("div");g.className="grid";
      items.forEach(function(f){
        var a=availAt(f,sel);
        var card=document.createElement("button");card.className="card"+(a.status==="up"?" up":"");
        var badge=a.status==="inc"?'<span class="badge inc">✓ '+esc(U.included)+'</span>':'<span class="badge up">🔒 '+esc(labelOf(a.unlock))+'</span>';
        var adm=f.adminOnly?'<span class="adm">· '+esc(U.adminTag)+'</span>':'';
        var note=(a.status==="inc"&&a.note)?'<p class="note">'+esc(a.note)+'</p>':'';
        var unlock=(a.status==="up")?'<p class="note" style="color:var(--warn)">'+esc(U.availableFromPre)+'<b>'+esc(labelOf(a.unlock))+'</b>'+esc(U.availableFromPost)+'</p>':'';
        card.innerHTML='<div class="top"><h4>'+esc(f.title)+adm+'</h4>'+badge+'</div><p class="desc">'+esc(f.description)+'</p>'+note+unlock+'<span class="cue">'+esc(U.howToUseCue)+'</span>';
        card.onclick=function(){showDetail(f.id)};
        g.appendChild(card);
      });
      root.appendChild(g);
    });
  }
  function renderList(){renderTiers();renderCatalog()}
  function stepsList(steps){return '<ol class="steps">'+steps.map(function(s,i){return '<li><span class="num">'+(i+1)+'</span><span>'+esc(s)+'</span></li>'}).join("")+'</ol>'}
  function bulletList(items){return '<ul class="bullets">'+items.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>'}
  function bodyHtml(f,id){
    var a=D.articles[id];
    var rich=a&&(a.overview||(a.whatYouSee&&a.whatYouSee.length)||(a.controls&&a.controls.length)||(a.tasks&&a.tasks.length));
    if(!rich){ return '<h3 class="cat">'+esc(U.howToUseHeading)+'</h3>'+stepsList(D.guides[id]||[f.howTo]); }
    var out="";
    if(a.overview) out+='<h3 class="cat">'+esc(U.overview)+'</h3><p class="desc">'+esc(a.overview)+'</p>';
    if(a.whatYouSee&&a.whatYouSee.length) out+='<h3 class="cat">'+esc(U.whatYoullSee)+'</h3>'+bulletList(a.whatYouSee);
    if(a.controls&&a.controls.length){
      out+='<h3 class="cat">'+esc(U.controlsOptions)+'</h3><div class="ctrls">'+a.controls.map(function(c){
        var adm=c.adminOnly?'<span class="adm"> · '+esc(U.adminTag)+'</span>':'';
        var pn=c.planNote?'<span style="color:var(--warn)"> · '+esc(c.planNote)+'</span>':'';
        return '<div class="ctrl"><div class="clabel">'+esc(c.label)+adm+'</div><div class="cdoes">'+esc(c.does)+pn+'</div></div>';
      }).join("")+'</div>';
    }
    if(a.tasks&&a.tasks.length) out+='<h3 class="cat">'+esc(U.commonTasks)+'</h3>'+a.tasks.map(function(t){return '<div class="task"><div class="ttitle">'+esc(t.title)+'</div>'+stepsList(t.steps)+'</div>'}).join("");
    if(a.tips&&a.tips.length) out+='<h3 class="cat">'+esc(U.tips)+'</h3>'+bulletList(a.tips);
    return out;
  }
  function showDetail(id){
    var f=feat(id); if(!f)return;
    var rows=D.plans.map(function(p){
      var a=availAt(f,p.id);
      var right=a.status==="inc"?'<span class="inc">✓ '+esc(U.included)+(a.note?' · '+esc(a.note):'')+'</span>':'<span class="up">🔒 '+esc(U.notIncluded)+'</span>';
      return '<li><span>'+esc(p.label)+'</span>'+right+'</li>';
    }).join("");
    var adm=f.adminOnly?' <span class="adm">· '+esc(U.adminTag)+'</span>':'';
    var d=document.getElementById("detail");
    d.innerHTML='<button class="backbtn" type="button">'+esc(U.backAllHelp)+'</button>'+
      '<div class="cat" style="color:var(--accent-ink)">'+esc(catLabel(f.category))+'</div>'+
      '<h2>'+esc(f.title)+adm+'</h2><p class="desc">'+esc(f.description)+'</p>'+
      '<div class="avail"><div class="cat">'+esc(U.availabilityByPlan)+'</div><ul>'+rows+'</ul></div>'+
      bodyHtml(f,id);
    d.querySelector(".backbtn").onclick=hideDetail;
    document.getElementById("main").style.display="none";
    d.style.display="block";
    window.scrollTo(0,0);
  }
  function hideDetail(){
    document.getElementById("detail").style.display="none";
    document.getElementById("main").style.display="block";
    window.scrollTo(0,0);
  }
  renderList();
})();
</script>
</body>
</html>
