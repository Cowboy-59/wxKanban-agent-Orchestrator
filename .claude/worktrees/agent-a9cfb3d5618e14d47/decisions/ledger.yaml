  decision: "Now, top priority, one batch. Build order: CI restored, document-kind column (owner applies), number and identity guards, retire and cleanup, surgical buildscope edits, new spec numbering, contract suite. Clients before the server."
  rationale: "Dependencies inside one batch."
  kind: Agreed
  evidence: confirmed
