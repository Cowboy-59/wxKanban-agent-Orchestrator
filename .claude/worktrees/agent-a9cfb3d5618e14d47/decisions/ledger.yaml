- id: D-0023
  scope: "SCOPE-019"
  question: "What happens when a kit command is given --help or an unknown option?"
  decision: "--help or -h anywhere prints that command's help and never runs it (gateway, every command). An unknown option on a write command is refused before any network call, naming the valid options."
  rationale: "dbpush --help ran a real push twice (customer 10-19, wxKanban 10-25)."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#5"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
- id: D-0024
  scope: "SCOPE-124"
  question: "How are specs numbered, and can a push take over another scope's number?"
  decision: "Every spec is numbered from its scope, <scope>-0001, -0002..., even when there is only one. Scope numbers are allocated by the hub. A push never writes over a number another scope owns (refuse, naming the owner and next free number). The hub spec id is the identity underneath. Renames are explicit. New scopes only."
  rationale: "create_specs renamed a web-created scope 035; numbers chosen from local folders collide."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#6"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
- id: D-0025
  scope: "SCOPE-124"
  question: "What identifies a spec/plan/tests document, and what happens to existing duplicates?"
  decision: "Identity is (spec id, kind), kind from the file name, never the heading; titles are display-only. Unique index on (project, spec, kind). Existing duplicates are found automatically; the kit asks the project user whether to run a cleanup, shows the keep/retire list, and fixes all in one pass after confirmation."
  rationale: "Title matching created the duplicates; SCOPE-124 open question 2 answered: unique index."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#7"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
- id: D-0026
  scope: "SCOPE-124"
  question: "Can documents be deleted, and how?"
  decision: "Yes, as retire: soft (who, when, why), hidden, restorable by an admin, audited. One service behind MCP project.delete_document (admin, dry run first), a web-app Retire action and the cleanup. The user is shown what each retire affects (scope/spec, linked tasks, last copy of its kind, matches local file) and verifies before confirming. SCOPE-124 T015 reversed."
  rationale: "Open request since 2026-07-26; duplicates could not be removed."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#8"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
- id: D-0027
  scope: "SCOPE-135"
  question: "How should /buildscope --edit change an existing scope?"
  decision: "Edit carries requirements and user scenarios; edits are per named item with everything else byte-identical (checked); a before/after diff is shown and nothing is written until confirmed; refuses when the stored copy is newer than the local file; each amendment is auto-recorded (date, reason, replaced text)."
  rationale: "Adding one line required re-sending all requirements; edit mode ignored them."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#9"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
- id: D-0028
  scope: "SCOPE-124"
  question: "When may a kit-defect report be marked resolved?"
  decision: "Only after a live probe of the deployed hub reproduces the customer's original steps and passes. Every fix ships a real-path regression test shown to fail without the fix; one contract suite for the three properties over all write tools in CI and nightly; a recurrence reopens the original report; CI is restored first."
  rationale: "At least three resolve-then-recur cycles since July."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#10"
  approved_by: "owner"
  date: 2026-10-25
