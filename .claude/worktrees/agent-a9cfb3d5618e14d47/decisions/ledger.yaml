- id: D-0052
  scope: "SCOPE-132"
  question: "How is 'the report predates the fix' proven when a report records no version for the product (D-0028 narrowing)?"
  decision: "Compare the report's recorded version for that product with fixedInVersion; with none recorded, compare the filing date with the fixing release's publish date (GitHub release, Marketplace or deploy). Product unclear, or no version and filed after publication: Ready to resolve, nothing sent. The server refuses a resolve whose recorded version is at or above fixedInVersion (recurrence_suspected). Cockpit reports record kitversion from now on. D-0028's live-probe rule holds everywhere else."
  rationale: "Cockpit-filed reports carry no kit version, so a version-only rule would resolve almost nothing; a report filed before the fix was published cannot have been running it."
  kind: Agreed
  evidence: confirmed
  source: "specs/Project-Scope/132-kain-autonomous-driver.md#FR-052"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0053
  scope: "SCOPE-019"
  question: "What is the need behind making the kit global?"
  decision: "A kit release is applied once per machine; every repo on it is current with no per-repo action and no AI session. Done = 5 repos, 1 action, 0 tokens per repo; a 6th repo needs only its project binding."
  rationale: "The owner runs 4-5 repos and every upgrade costs tokens and time per repo. Where the tokens go today is not yet measured."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#1"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0054
  scope: "SCOPE-019"
  question: "Who is the global kit for, and what comes first?"
  decision: "Everyone, customers included. First version = Claude Code users with the Cockpit; Cursor stays per-repo for now; existing per-repo installs keep working beside a global one."
  rationale: "Other tools' user-level support is unverified, so it is not promised."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#2"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0055
  scope: "SCOPE-019"
  question: "How is the kit made global: plugin, revived sync-global, or the existing installer retargeted?"
  decision: "Retarget the existing installer (upgrade-kit and the Cockpit) to user level: skills and commands into ~/.claude, runtime in a version-stamped machine-wide folder, per-repo binding. Command names stay unchanged."
  rationale: "Reuses the most existing code and keeps /implement, /buildscope and the rest named as they are."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#3"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0056
  scope: "SCOPE-019"
  question: "What is the smallest useful version?"
  decision: "Step 0: live spike in a throwaway repo plus the secret-path build gate (stop condition: return to the plugin option). Step 1: installer, launcher, hook rewrite, Connect this project, migrate with undo, 3-OS CI, cheap version parts, run on the owner's repos. Step 2: customers."
  rationale: "Meets the need on the owner's repos first; the owner's repos are legacy installs so migrate cannot wait."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#4"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0057
  scope: "SCOPE-019"
  question: "Which parts of the kit stay per repo?"
  decision: "Code and rules global; identity, secrets and data per repo; the repo records the kit version it expects. Hook wiring moves to user level and self-gates on .wxkanban-project.json. .claude/settings*.json and .husky/ stay per repo. The global folder is built only from the release artifact."
  rationale: "The kit already preserves the repo-owned files; a global folder read by every repo must never take anything from one repo."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#5"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0058
  scope: "SCOPE-019"
  question: "What happens when a repo and the global kit disagree on version?"
  decision: "Latest by default; the global folder keeps one previous version; a repo may pin with a new kitPin field; each repo stamps its data format and the kit refuses newer data; data migrations are lazy, per repo, with a backup."
  rationale: "The real skew risk is repo data formats, not code; keeping the previous version gives a rollback."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#6"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0059
  scope: "SCOPE-019"
  question: "How do hooks and scripts find a kit that is no longer inside the repo?"
  decision: "A Node launcher reads the repo's .wxkanban-project.json, picks the pinned or current kit, runs the script with cwd unchanged and exits quietly with no binding. The installer stamps its absolute path into the ~190 call sites; PATH is optional. The SessionStart hook runs from the built bundle. A stable current alias serves read-only docs."
  rationale: "Scripts already find the project from the working directory; only the call sites assume the repo location. A Dock-launched VS Code on macOS has a thin PATH."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#7"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0060
  scope: "SCOPE-019"
  question: "How do existing per-repo installs move to the global kit, and how is it undone?"
  decision: "Launcher lookup = kit inside the repo, then pin, then current. A migrate command: dry run by default; moves files identical to the release into .wxai/kit-backup/<timestamp>/, never deletes; keeps differing files; never runs git; refuses to remove git-tracked kit files unless the user confirms the team has the global kit; undo restores everything."
  rationale: "A shared repo breaks for teammates if kit files are deleted and committed; customer-edited kit files must not be destroyed."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#8"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0061
  scope: "SCOPE-019"
  question: "How are secrets and project binding kept safe in a global kit?"
  decision: "Identity only from the repo (no default, no cached project id); no secrets in the global folder or user settings; the release build fails on any secret-bearing path; the global folder is read-only while running; only identity-free state is machine-wide; the entitlement stays per repo."
  rationale: "A user-level token would let every repo act as one project; a leaked file in a global folder reaches every repo."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#9"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0062
  scope: "SCOPE-019"
  question: "What is the Cockpit install and update flow, and what happens to the help?"
  decision: "Install once per machine; Connect this project per project; one check per machine, one-click install of the new version beside the old, lock file, reload notice; updates stay notify-and-confirm; legacy repos get a move-this-project row; installCommands and impact.installHook retired in global mode; help in six languages written with the build; retire the /sync-global page."
  rationale: "Four per-workspace actions collapse into two; the workspace unpack that overwrote a .gitignore goes away."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#10"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0063
  scope: "SCOPE-019"
  question: "What order does the global kit go in?"
  decision: "Now: fix the .wxai/.entitlement release leak and add the secret-path gate, run the Step 0 spike, measure the token baseline. Next: Step 1 after the kit write-safety batch and SPEC-148 close and CI runs again. Later: Step 2."
  rationale: "Step 1 changes the same installer code as the write-safety batch; its CI matrix needs CI running; the leak is a real defect today."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#11"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0064
  scope: "SCOPE-019"
  question: "What new requirements came out of the discussion?"
  decision: "The release secret-path build gate, the kitPin field, the migrate command, a 3-OS CI matrix, and the token-baseline measurement."
  rationale: "Each follows from a risk raised on the panel."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#12"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
