- id: D-0078
  scope: "SCOPE-019"
  question: "Step 0 spike: when a repo and the user level both have a command of the same name, which one runs?"
  decision: "The user-level copy wins. This corrects the earlier lookup order for commands: a global command shadows a legacy repo's command files, a repo pin cannot select an older repo-side command file (it can only act at the launcher, which the global command text must call), and migration of commands is cleanup rather than a behavior risk."
  rationale: "Live run of claude -p in a folder with both copies: the user copy ran; with the user copy hidden the repo copy ran. Claude Code 2.1.98, Windows, one run per case."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-global-kit.md#26"
  approved_by: "owner"
  date: 2026-10-27
  supersedes: null
- id: D-0079
  scope: "SCOPE-019"
  question: "Step 0 spike: do user-level and repo-level hooks both run?"
  decision: "Both run, once each, at the same moment; neither replaces the other. Migrate must therefore remove the repo hook entries it can prove are the kit's own, or every hook runs twice in a migrated repo."
  rationale: "Live run with a user SessionStart hook and a repo SessionStart hook logging to one file: two entries, one each, same millisecond."
  kind: Changed
