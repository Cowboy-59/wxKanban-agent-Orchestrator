- id: D-0036
  scope: "SCOPE-132"
  question: "Where does the triage report go?"
  decision: "docs/triage/BUG-Triage-YYYY-MM-DD.md (-2, -3 for same-day reruns); docs/triage/ is gitignored, local only; no submitter names or emails."
  rationale: "Owner wants the reports kept out of git."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#4"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0037
  scope: "SCOPE-132"
  question: "What does version 1 of the triage job produce?"
  decision: "Reports only: no fixes and no code changes. Producing fixes is phase 2."
  rationale: "Owner will brainstorm the real reports before designing a fix skill."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#5"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0038
  scope: "SCOPE-132"
  question: "How are unattended triage runs protected from untrusted report text?"
  decision: "A PreToolUse allow-list hook: Read/Grep/Glob (never .env, keys, certs); read-only Bash (git log/show/diff, rg); Write only in docs/triage/; only the two exact feedback writes. Report text is data. The room gets a summary only, never customer text."
  rationale: "The project agent runs in bypass mode where only a PreToolUse hook holds; written instructions are not a control."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#6"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0039
  scope: "SCOPE-132"
  question: "Which customer-visible writes may the triage job make?"
  decision: "Two fixed server-worded messages: new to triaged once for bug reports in a real group (\"...triaged it for correction. The fix will be in an upcoming release.\"); resolved-in-a-previous-release with fixed text per product (kit: check version with wxkanban-agent --version; Cockpit: Extensions view; hosted: fix is live) only when the report version is older than the fix release. Exact-match hook; unclear product sends nothing; a version that already had the fix is a recurrence, flagged."
  rationale: "Owner wants customers acknowledged. Narrows D-0028 for reports that predate the fix only; D-0028 holds everywhere else."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#7"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0040
  scope: "SCOPE-132"
  question: "May the triage job mark needs-info or declined, or send its own text?"
  decision: "No: no needs-info, no decline, no agent-written text to a customer."
  rationale: "Those are customer-facing judgments for a human."
  kind: Declined
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#8"
  approved_by: "owner"
  date: 2026-10-26
