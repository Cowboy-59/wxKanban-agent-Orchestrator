- id: D-0111
  scope: "SCOPE-132"
  question: "Feed the agent from the raw session transcript or the .remember files?"
  decision: "Declined: a masked per-turn kit hook is the source."
  rationale: "The transcript holds too much to leave the machine and .remember is a third-party plugin."
