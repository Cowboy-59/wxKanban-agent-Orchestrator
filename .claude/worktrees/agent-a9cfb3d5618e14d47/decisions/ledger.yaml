  decision: "Stop with a plain message when Allow remote is off or there is no company room, with no fallback. Redaction check before posting. The bridge treats [HANDOFF] as context only. The kit never edits .env and gives a one-time notice that the keys are no longer read."
  rationale: "The bridge runs in bypass permissions, and remote must stay a company decision."
