  question: "Which scopes carry the kit write-safety fixes?"
  decision: "No new scope: SCOPE-124 Amendment C (number takeover, document identity, delete document, recurrence; reopen FR-005 and FR-008), a SCOPE-135 amendment (buildscope edit), SCOPE-019 (CLI --help and unknown options)."
  rationale: "Each fix goes in the scope that already owns the code."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#3"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
