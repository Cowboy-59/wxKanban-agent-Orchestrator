- id: D-0114
  scope: "SCOPE-132"
  question: "What is the need behind the Project Agent working the dev plan by itself?"
  decision: "Move each project forward without the owner starting each unit; answer from recorded decisions; stop only for something new. Learn means the decision ledger, not watching sessions."
  rationale: "Six apps in four months; the owner cannot drive each one by hand."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#1"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0115
  scope: "SCOPE-132"
  question: "Who may use the dev-plan autopilot, and how is it turned on?"
  decision: "The owner first, then every customer. A per-project switch, off by default, server-enforced and audited, requires Allow remote and is changed by the same people as Allow remote. One new column beside allowremote, applied by hand."
  rationale: "Each customer must be able to turn it off themselves; default off."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#2"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0116
  scope: "SCOPE-132"
  question: "Reuse or build new for the dev-plan autopilot?"
  decision: "Reuse the dev plan state, G.O.D.'s drive, god-loop moved into the kit, the askgate decision queue, K.A.I.N. answer-and-review and run capture. Build the switch, startup list and skips, self-start, timed posts and time hookup."
  rationale: "Reuse what we can, build what is needed."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#3"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0117
  scope: "SCOPE-132"
  question: "What is the smallest useful version of the dev-plan autopilot?"
  decision: "Post the outstanding scopes in build order, take skips, then run validateScope, createSpecs and implement per scope in a fresh session. Not in v1: other machines, a cross-project coordinator, session watching."
  rationale: "All the tools exist; the agent compiles them as needed."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#4"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0118
  scope: "SCOPE-132"
  question: "Who answers each command's gates during an unattended dev-plan run?"
  decision: "The owner's go on the startup list is the approval. Gates are answered only from the scope text and the ledger; anything else is parked as one line (project, scope, question, what it blocks). Unbuilt scopes stay with the owner."
  rationale: "Ask K.A.I.N. or the room for help with a short, terse message."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#5"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0119
  scope: "SCOPE-132"
  question: "May the agent write and commit code in the tree without the owner present?"
  decision: "Yes: one worktree per scope, one local commit per unit, never a push. No dev plan, no start. Never runs against production; parks the unit if its tests point there."
  rationale: "The agent may do it as long as the dev plan is there; issues are relayed and work continues."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#6"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0120
  scope: "SCOPE-132"
  question: "Which plan is the source of what is outstanding?"
  decision: "The server devplan, after a per-scope scope_stage check. G.O.D.'s roadmap adds phase gates only where it exists."
  rationale: "The devplan is the source of truth."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#7"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0121
  scope: "SCOPE-132"
  question: "When a unit fails or stops during the run, park it or halt?"
  decision: "Park it and go on, with one short line to K.A.I.N. or the room. Dependents wait. Each unit ends with an explicit done or failed line."
  rationale: "Keep going; notify short and concise."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#8"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0122
  scope: "SCOPE-132"
  question: "How does the agent report status during the run?"
  decision: "Always post every 15 minutes from the state file, masked, to the room and K.A.I.N.: full detail when there is news, a short nothing-changed heartbeat otherwise, paused when paused. STATUS on demand. Full summary when the list finishes and at 18:00 if still running."
  rationale: "Changed from skipping unchanged posts: a heartbeat tells the owner the agent is alive when remote."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#9"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0123
  scope: "SCOPE-132"
  question: "How are context and cost controlled over a long run?"
  decision: "No cost rules of its own; defer to rescue-tokens, the SPEC-143 routing tiers, the SCOPE-093 advisor and a fresh session per unit."
  rationale: "Changed from panel-invented cost controls: the existing cost machinery already does this."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#10"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0124
  scope: "SCOPE-132"
  question: "Fit and priority of the dev-plan autopilot?"
  decision: "High priority; to buildscope, whose reuse check decides amendment vs new scope. Build after the SPEC-149 bridge handoff guard fix, SCOPE-102 FR-013 (API key stripped from the child session, specified but not built) and SCOPE-132 Amendment G piece A."
  rationale: "Fastest route to the delivery goal; the three fixes keep unattended runs safe and on the subscription."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#11"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0125
  scope: "SCOPE-132"
  question: "How is the agent's time kept for time and billing?"
  decision: "As SPEC-005 FR-007 Resource time through the existing run capture and daily pull, each run tagged with its scope and task. No attribution to a person."
  rationale: "Agents as Resources already exists in Time and Billing."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#12"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0126
  scope: "SCOPE-132"
  question: "Which subscription plans get the dev-plan autopilot?"
  decision: "Every plan, no plan gate. Time booking works only where the company has Time and Billing. One help catalog entry."
  rationale: "Every customer gets it (item 2); a plan limit adds no safety."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#13"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0127
  scope: "SCOPE-132"
  question: "What happens to dependent scopes when the owner skips a scope?"
  decision: "The skip lists dependent scopes from the existing scope-impact check; each is skipped or partly worked with the safe tasks listed to confirm. A partial scope stays partial; skipped parts stay on every summary until released; choices kept in the run state."
  rationale: "A scope can be partly worked even if part of it was skipped."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#14"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0128
  scope: "SCOPE-132"
  question: "Alert the owner when a 15-minute post is missed?"
  decision: "Yes. The server raises it from the existing connection record (not live during a run, or no post for 20 minutes): one line to the room and K.A.I.N. per outage, one back line on return, only during an active unpaused run."
  rationale: "A down agent cannot report itself; the server already tracks liveness."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#15"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0129
  scope: "SPEC-005"
  question: "Which plan does Time and Billing require: SMALL_BUSINESS (server route) or CONSULTANT (help catalog)?"
  decision: "Open: the owner answers."
  rationale: "Parked as a separate fix outside the autopilot idea; three plan lists disagree."
  kind: Parked
  evidence: unknown
  source: "docs/brainstorms/2026-11-07-project-agent-autopilot-devplan.md#16"
  approved_by: "owner"
  date: 2026-11-07
  supersedes: null
- id: D-0130
  scope: "agent-coordination"
  question: "What is the need behind agent teamwork on a collision?"
  decision: "Coordination, not prevention: one agent per piece of work at a time, visible to every agent, handed to a ready agent with an announcement and no owner step; safety is the floor."
  rationale: "Done when two agents given the same work: one works it, the other reports the holder and moves on, nothing lost or committed twice."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#1"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0131
  scope: "build-process"
  question: "Who decides a task is done once a scope is signed off?"
  decision: "The Software Manager (Project Agent), not the programmer subagent; its done check includes every new piece having a caller outside the tests."
  rationale: "SPEC-154 was reported done while several pieces had no caller in production; the owner runs the work as CTO, design committee, manager and programmers."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#2"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0132
  scope: "build-process"
  question: "How are a scope's tasks cut?"
  decision: "By user story (existing rule, enforced); each story opens with a walking-skeleton task from the real entrance to the result, its end-to-end test written failing at spec time; each scope ends with a connect-and-prove-it task that cannot be skipped or marked done by hand."
  rationale: "Cutting one task per requirement left no task owning the connections, and that knowledge was lost when the session was cleared."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#3"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0133
  scope: "feature-list"
  question: "Should there be a feature list above scopes?"
  decision: "Yes: request, features, scopes, stories, tasks. The committee presents must-have and optional features per request and the CTO reviews item by item; each feature records entrances, delivering scopes, end-to-end tests and a test-set status; repo file read at session start, mirrored to the DB; buildscope names each scope's feature; existing scopes grouped once."
  rationale: "Owner idea: scopes that belong together are not grouped, and nothing shows whether a change breaks or enhances a feature. Kept open to adjust after first real use."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#4"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0134
  scope: "SCOPE-137"
  question: "How should Change Impact approval stops work during an approved build?"
  decision: "Approved-plan mode: a signed-off scope covers the features, scopes and files it names; edits inside it by the manager or any programmer are logged, go ahead, and are shown at the closing task. Data loss, login and accounts, secrets, money, schema, and crossings into an unnamed feature always stop; what stops reaches chat (finish T022). Expires when the scope closes."
  rationale: "Approvals bound to exact edits caused repeated stops and blocked every gated edit delegated to a subagent."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#5"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0135
  scope: "agent-coordination"
  question: "How do programmer subagents avoid conflicting in one tree?"
  decision: "One manager per working tree; a claims board in the repo (task, files, holder); a programmer needing a held file takes the next free task; only the manager commits, reassigns and announces handovers. Second version: worktree per scope merged one at a time, and scope check-out fixed (race, stale on quiet heartbeat, one-person companies)."
  rationale: "Fits the manager-and-programmers operating model and keeps the existing one-agent-per-tree lock."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#6"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0136
  scope: "wxBrainstorm"
  question: "Should brainstorm have an analyze switch for existing apps and conversions?"
  decision: "Yes: /wxBrainstorm --analyze (optional --dir, --conversion) runs the existing analyzers on one app, each in its own subagent; the panel presents must fix, gaps and optional improvements grouped by feature; the CTO reviews item by item; findings saved so a re-run shows what changed; one app per sitting, then a cross-app pass that fixes a repeated gap once in the converter."
  rationale: "Owner idea; first use is 14 customer conversions, so it is built first. The first app is the trial run."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#7"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0137
  scope: "build-process"
  question: "In what order are the build-process changes built?"
  decision: "(1) analyze switch, (2) done and task cutting, (3) approved-plan mode and the chat relay, (4) Ask Gate on, (5) feature list, (6) manager as coordinator, first then second version."
  rationale: "The analyze switch is needed first for the conversions; finishing SPEC-155 is the first real test of step 2."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#8"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0138
  scope: "ask-gate"
  question: "Should the Ask Gate run in this project?"
  decision: "Yes: turn it on so approved lists and logged assumptions answer build-time questions; only real choices stop."
  rationale: "It is built but not installed here, and many build-time stops were questions the scope should already have answered."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#9"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0139
  scope: "wxBrainstorm"
  question: "How should the brainstorm panel work with the owner?"
  decision: "The panel brings the ideas and a complete proposal (must-have and optional); the owner reacts, changes or vetoes; it asks only real choices (money, security, client data, irreversible), never open questions with obvious answers."
  rationale: "Owner direction: the panel has resources the owner lacks, and the owner already knows the obvious answers."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#10"
  approved_by: "owner"
  date: 2026-11-08
  supersedes: null
- id: D-0140
  scope: "agent-coordination"
  question: "How is work handed between agents?"
  decision: "Through the manager, not agent-to-agent claiming; the topic widened from collisions to the whole build process."
  rationale: "Changed from the original request after the operating model was agreed."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-08-build-process-smoothing.md#11"
