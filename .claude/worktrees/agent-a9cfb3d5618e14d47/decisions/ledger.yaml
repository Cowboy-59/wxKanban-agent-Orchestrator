- id: D-0096
  scope: "SCOPE-149"
  question: "How does the handoff summary reach the Project Agent's room, and who is the recipient?"
  decision: "The session writes the summary to .wxai/handoff/ and the Project Agent posts it as [HANDOFF] under its own identity. The recipient is the Project Agent, not KAIN or Jarvis. The command is HANDOFF REMOTE; GO REMOTE is retired with no redirect; an unposted handoff expires after 4 hours with a removal note in the room."
  rationale: "The room credential belongs to the Project Agent process, and a session posting on its own could look like the agent speaking."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-27-go-remote-handoff.md#15"
