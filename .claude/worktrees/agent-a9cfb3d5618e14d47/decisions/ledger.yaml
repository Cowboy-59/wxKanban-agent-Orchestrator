- id: D-0085
  scope: "SCOPE-102"
  question: "What is the smallest useful GO REMOTE?"
  decision: "Check the room, write a fixed-template summary of about 2,000 characters, post it starting with [HANDOFF], report back, and launch no bridge. Build the template and rule text, a small post script, and a [HANDOFF] guard in the bridge."
  rationale: "Reuses the room, the command parser and the Allow-remote gate."
