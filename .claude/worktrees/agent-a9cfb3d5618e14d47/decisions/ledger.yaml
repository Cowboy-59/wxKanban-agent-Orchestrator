- id: D-0018
  scope: "SCOPE-143"
  question: "Should the main session's commands run on a cheaper model than the owner's session model?"
  decision: "Yes. Each kit command declares its own tier for its own turn (for example dbpush on Haiku, buildscope and implement on Opus); the owner's /model choice is never changed silently. A spike first proves the command-file model setting works for slash commands; otherwise the command hands its work to a subagent on the declared tier."
  rationale: "The owner observed the main session stays on Opus 5.5 for every command, including simple ones."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-10-23-agent-model-routing.md#18"
  approved_by: "owner"
  date: 2026-10-23
  supersedes: null
- id: D-0019
  scope: "SCOPE-124"
  question: "What bar must every kit write meet?"
  decision: "Every kit write must be repeatable (the same files twice change nothing), contained (it touches only what it names) and loud (anything unexpected stops before writing)."
  rationale: "The Oct 19 incident broke all three at once."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#1"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
- id: D-0020
  scope: "SCOPE-124"
  question: "Who do the kit write defects affect, and who is told when they ship?"
  decision: "Every kit user, worst for multi-developer teams and unattended AI sessions; fixes must hold when Claude is typing. Every company with an open report on these defects gets a note when it ships."
  rationale: "48 reports from 14 companies since June; 22 open from 7."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-25-kit-write-safety.md#2"
  approved_by: "owner"
  date: 2026-10-25
  supersedes: null
