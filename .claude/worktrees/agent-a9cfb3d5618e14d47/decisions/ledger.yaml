- id: D-0097
  scope: "SCOPE-132"
  question: "How should K.A.I.N. reach a repo's Project Agent without HANDOFF REMOTE?"
  decision: "A two-way direct line: K.A.I.N. reads the agent's state and directs it, and does not use the room. HANDOFF REMOTE stays, YappChatt only."
  rationale: "A handoff is a one-time snapshot and the room has been missing things; the owner chose two-way over the suggested read-only line."
  kind: Changed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#1"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0098
  scope: "SCOPE-132"
  question: "Who uses the direct line, and can several K.A.I.N.s direct one agent?"
  decision: "The operator now; later anyone in the existing K.A.I.N. reach table. Many read, one directs: an explicit hold, released on stop, lapsing after 3 minutes; every direction audited with person and device; the Agent Access panel shows the director."
  rationale: "Two people steering one headless session at once is the problem the single-agent rule already solves."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#2"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0099
  scope: "SCOPE-132"
  question: "Where does the K.A.I.N.-agent meeting point live?"
  decision: "An agent mailbox on the wxKanban app: both sides long-poll over HTTPS with existing credentials through the existing reach, Allow-remote and audit rules; a small mailbox table; a transport-neutral message format."
  rationale: "Works on App Runner today and reuses one access rule; a WebSocket can replace long-polling later."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#3"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0100
  scope: "SCOPE-132"
  question: "What is the smallest useful version of the direct line?"
  decision: "Piece A (read): per-turn masked kit hook to .wxai/session-feed.jsonl, agent keeps a rolling summary and last entry, carried on the connection-record heartbeat, K.A.I.N. reads via one MCP tool. Then piece B (direct): mailbox, directing hold, gates, audit and panel. Not first: WebSocket, raw transcript, history, Cockpit live view."
  rationale: "Piece A alone answers 'where are we?' and is mostly reuse."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#4"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0101
  scope: "SCOPE-132"
  question: "How is the SCOPE-132 FR-032 'direction in the room' rule changed?"
  decision: "SCOPE-132 Amendment G: FR-032 narrowed (room for people and HANDOFF REMOTE; K.A.I.N. directs via the mailbox) with a superseded note; new FRs for pieces A and B; kain-contract.md updated in the same release; K.A.I.N.'s connect no longer creates or requires a room."
  rationale: "Builds on Amendments D and F; K.A.I.N. is pre-release, so the contract can change freely."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#5"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0102
  scope: "SCOPE-132"
  question: "What session content may leave the machine for K.A.I.N.?"
  decision: "Only the rolling summary (max 1,500 characters), last entry (max 500) and open-blocker titles, masked twice; feed file gitignored; overwrite-only on the connection record, no history; on by default when Allow remote is on, with a local per-repo off switch; Cockpit shows sharing status; K.A.I.N. reads audited."
  rationale: "Masking catches secret shapes but not plain-word customer data, so the less that leaves the better."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#6"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0103
  scope: "SCOPE-132"
  question: "Does the direct line depend on App Runner WebSocket support?"
  decision: "No: long-polls held about 50 seconds inside the App Runner request limit; WebSocket support is a later fact, not a blocker."
  rationale: "The mailbox design removes the dependency."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#7"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0104
  scope: "SCOPE-132"
  question: "How do the agent and K.A.I.N. prove who they are on the mailbox?"
  decision: "The agent uses its existing project kit token and must hold the project's open connection record; K.A.I.N.'s person and device are stamped by the server from the device token, with reach and the hold checked on every post."
  rationale: "Server-stamped identity replaces the room's spoofable text tag."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#8"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0105
  scope: "SCOPE-132"
  question: "How is regression of the existing agent features prevented?"
  decision: "The per-turn hook runs under 200 ms, always exits cleanly, does nothing when WXAI_REMOTE=1, keeps a 200-line feed and ships via the kit hook sync; the mailbox poll loop is isolated from the room, triage, handoff and outbox; HANDOFF REMOTE unchanged."
  rationale: "The hook runs on every turn, and the agent's own session must not feed itself."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#9"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0106
  scope: "SCOPE-132"
  question: "How do the override, push and approver gates apply on the direct line?"
  decision: "Room and mailbox messages share one inbound path; a gate answer on the mailbox needs the directing hold and Room Approver; a waiting gate is shown on both channels, first valid answer wins, audited with channel, person and device."
  rationale: "A separate handler would let a gate drift and become a way around it."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#10"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0107
  scope: "SCOPE-132"
  question: "How does the mailbox avoid the YappChatt client's silent failures?"
  decision: "Every poll is a heartbeat with last-seen on both sides (live, stale, gone); 401 leads to token renewal or re-sign-in; messages sequenced, acknowledged and redelivered, 24-hour expiry with an expired-unread count; directions delivered more than 10 minutes late need reconfirming."
  rationale: "Lessons from the reconnect defect, so the new line cannot go deaf unnoticed."
  kind: Added
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#11"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
- id: D-0108
  scope: "SCOPE-132"
  question: "When is the direct line built?"
  decision: "Now, in order: the YappChatt reconnect fix, SCOPE-132 Amendment G via /buildscope then G.O.D., piece A release, piece B release with the K.A.I.N.-side client."
  rationale: "The room must be reliable first since HANDOFF REMOTE stays on it."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-11-03-kain-direct-agent-line.md#12"
  approved_by: "owner"
  date: 2026-11-03
  supersedes: null
