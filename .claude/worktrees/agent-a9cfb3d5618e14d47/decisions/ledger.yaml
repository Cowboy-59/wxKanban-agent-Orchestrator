- id: D-0033
  scope: "SCOPE-132"
  question: "What need does a project-agent feedback-triage job serve?"
  decision: "The feedback queue becomes release-ready batches: every report from My Feedback and Incoming lands in exactly one group, and nobody has to run the triage by hand."
  rationale: "The triage agent exists but only runs when someone starts it; batch-by-area needs reports grouped."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#1"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0034
  scope: "SCOPE-132"
  question: "Who gets the feedback-triage job?"
  decision: "Only a company that owns a feedback sink; today the wxKanban project agent. wxperts is the first user and test bed. Customer project agents do not get it."
  rationale: "Incoming is only served to the sink owner, and only the sink owner can fix the reported code."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#2"
  approved_by: "owner"
  date: 2026-10-26
  supersedes: null
- id: D-0035
  scope: "SCOPE-132"
  question: "Reuse or build new for project-agent feedback triage?"
  decision: "Reuse feedback-triage, moved into the repo .claude/agents/ (this repo only, not shipped in the kit); reuse the server per-report triage as input; build only the trigger and the output."
  rationale: "Grouping and triage logic already exists; the personal-folder copy exists on one machine only."
  kind: Agreed
  evidence: confirmed
  source: "docs/brainstorms/2026-10-26-project-agent-feedback-triage.md#3"
  approved_by: "owner"
  date: 2026-10-26
