openapi: "3.0.3"
info:
  title: wxKanban Projects API — Feature 008-007
  version: "1.0.0"
  description: |
    Project layout and lifecycle workspace endpoints.
    All endpoints require JWT Bearer token (Authorization header or httpOnly cookie).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProjectCard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        hourlyrate: { type: string, nullable: true }
        allocatedhours: { type: string, nullable: true }
        pmsystems: { type: string, nullable: true }
        securityclassification: { type: string, nullable: true }
        currentphase: { type: string }
        activephase:
          $ref: '#/components/schemas/PhaseInfo'
        opentaskcount: { type: integer }
        createdat: { type: string, format: date-time }
        updatedat: { type: string, format: date-time }

    PhaseInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        phasename: { type: string }
        status: { type: string, enum: [pending, in_progress, complete, reopened] }
        assigneduserid: { type: string, format: uuid, nullable: true }
        assignedusername: { type: string, nullable: true }
        enteredat: { type: string, format: date-time, nullable: true }
        completedat: { type: string, format: date-time, nullable: true }

    PhaseCompletion:
      type: object
      properties:
        canAdvance: { type: boolean }
        criteria:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              passed: { type: boolean }
              detail: { type: string }

    ProjectDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [overview, readme, architecture] }
        title: { type: string }
        content: { type: string }
        updatedat: { type: string, format: date-time }

    ScaffoldResponse:
      type: object
      properties:
        project:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            description: { type: string, nullable: true }
            currentphase: { type: string }
        overview:
          type: object
          properties:
            content: { type: string }
        specs:
          type: array
          items:
            type: object
            properties:
              number: { type: string }
              title: { type: string }
              content: { type: string }
        phases:
          type: array
          items:
            type: object
            properties:
              phasename: { type: string }
              status: { type: string }
              assigneduser:
                type: object
                nullable: true
                properties:
                  fullname: { type: string }
                  emailaddr: { type: string }

security:
  - bearerAuth: []

paths:

  # ─── Project List ───────────────────────────────────────────────────────────

  /api/projects:
    get:
      summary: List projects (visibility-filtered)
      description: |
        ADMIN: returns all company projects.
        Non-admin: returns only projects where the authenticated user is the
        assigneduserid for the currently active (in_progress) phase.
      parameters:
        - name: phase
          in: query
          schema: { type: string }
          description: Filter by phase name
        - name: search
          in: query
          schema: { type: string }
          description: Filter by name substring
      responses:
        200:
          description: Project list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectCard' }
                  count: { type: integer }
        401:
          description: Unauthorized

    post:
      summary: Create project (ADMIN only)
      description: |
        Creates project record, auto-creates 6 phase records (Phase 1 = in_progress),
        and asynchronously triggers AI scaffolding (overview + spec stubs).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                description: { type: string }
                hourlyrate: { type: number, minimum: 0 }
                allocatedhours: { type: number, minimum: 0 }
                pmsystems: { type: string, description: "Comma-separated: jira,monday,asana" }
                securityclassification:
                  type: string
                  enum: [Internal, Confidential, Client-Facing]
                phaseassignments:
                  type: object
                  description: Map of phase name to user ID
                  example: { "Design": "uuid-1", "Implementation": "uuid-2" }
      responses:
        201:
          description: Project created (AI scaffolding triggered asynchronously)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  project: { $ref: '#/components/schemas/ProjectCard' }
                  scaffolding: { type: string, enum: [pending], description: "AI scaffolding is running" }
        400:
          description: Validation error
        401:
          description: Unauthorized
        403:
          description: ADMIN role required

  # ─── Project Detail ─────────────────────────────────────────────────────────

  /api/projects/{id}:
    get:
      summary: Get project workspace data
      description: |
        Returns project with all 6 phase records and active phase detail.
        Returns 403 for non-admin users not assigned to the active phase.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Project workspace data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  project: { $ref: '#/components/schemas/ProjectCard' }
                  phases:
                    type: array
                    items: { $ref: '#/components/schemas/PhaseInfo' }
        401:
          description: Unauthorized
        403:
          description: Not assigned to active phase
        404:
          description: Project not found

    patch:
      summary: Update project details (ADMIN only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                hourlyrate: { type: number }
                allocatedhours: { type: number }
                pmsystems: { type: string }
                securityclassification: { type: string }
      responses:
        200:
          description: Updated
        403:
          description: ADMIN role required

  # ─── Phase Management ────────────────────────────────────────────────────────

  /api/projects/{id}/phases:
    get:
      summary: Get all phases for a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: All 6 phase records
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  phases:
                    type: array
                    items: { $ref: '#/components/schemas/PhaseInfo' }

  /api/projects/{id}/phases/{phaseid}/assign:
    patch:
      summary: Assign user to phase (ADMIN only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneduserid: { type: string, format: uuid, nullable: true }
      responses:
        200:
          description: Assignment updated

  /api/projects/{id}/phases/{phaseid}/completion:
    get:
      summary: Check phase completion criteria
      description: Returns real-time pass/fail status for each completion criterion.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Completion status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  completion: { $ref: '#/components/schemas/PhaseCompletion' }

  /api/projects/{id}/phases/{phaseid}/advance:
    post:
      summary: Advance phase to next (ADMIN or assigned TEAM_MANAGER)
      description: |
        Validates completion criteria. If all pass, marks phase complete,
        activates next phase, logs transition to companyauditlogs.
        Returns 409 if criteria not met.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        200:
          description: Phase advanced
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  completedphase: { $ref: '#/components/schemas/PhaseInfo' }
                  activatedphase: { $ref: '#/components/schemas/PhaseInfo' }
        409:
          description: Completion criteria not met
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  completion: { $ref: '#/components/schemas/PhaseCompletion' }
        403:
          description: Not authorized

  /api/projects/{id}/phases/{phaseid}/reopen:
    post:
      summary: Reopen a prior phase (ADMIN or assigned TEAM_MANAGER)
      description: |
        Sets phase back to in_progress. Does not destroy work in later phases.
        Requires reason. Logs event to companyauditlogs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        200:
          description: Phase reopened
        403:
          description: Not authorized

  # ─── Phase Tasks ─────────────────────────────────────────────────────────────

  /api/projects/{id}/phases/{phaseid}/tasks:
    get:
      summary: List tasks for a phase
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Task list

    post:
      summary: Create task in phase
      description: Beta phase requires ADMIN approval — logged to audit log.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                issuetype: { type: string, enum: [task, bug, feature] }
                priority: { type: string, enum: [low, medium, high, critical] }
                assignedtoid: { type: string, format: uuid }
                effort: { type: string, enum: [small, medium, large, unknown] }
      responses:
        201:
          description: Task created
        403:
          description: Beta phase requires ADMIN approval

  /api/projects/{id}/phases/{phaseid}/tasks/{taskid}:
    patch:
      summary: Update task (status, assignee, result)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Task updated

  # ─── Phase Specifications (Design Phase) ─────────────────────────────────────

  /api/projects/{id}/phases/{phaseid}/specs:
    get:
      summary: List specifications for Design phase
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Specification list

    post:
      summary: Create specification stub in Design phase
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: phaseid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        201:
          description: Spec created

  # ─── Project Documents ────────────────────────────────────────────────────────

  /api/projects/{id}/documents:
    get:
      summary: List project documents (overview, readme, etc.)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectDocument' }

  /api/projects/{id}/documents/{docid}:
    patch:
      summary: Update project document content (ADMIN only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: docid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        200:
          description: Document updated
        403:
          description: ADMIN role required

  # ─── Scaffold (project.init) ──────────────────────────────────────────────────

  /api/projects/{id}/scaffold:
    get:
      summary: Get scaffold data for project.init command
      description: |
        Returns project metadata, overview document content, all spec stubs,
        and phase assignments with assigned user names.
        Used by the project.init Claude Code command.
        Requires WXKANBAN_API_TOKEN as Bearer token.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Scaffold data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScaffoldResponse' }
        403:
          description: Not authorized to access this project
