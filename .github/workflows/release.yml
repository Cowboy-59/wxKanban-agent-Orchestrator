name: Release kit tarball

# MANUAL ONLY — deliberately NOT `on: push: tags: v*`.
#
# The normal release path is wxKanban's `scripts/sync-to-orchestrator.mjs --release`,
# which mirrors the kit, runs `scripts/build-release.mjs` here, uploads the four
# assets with `gh release create`, and then SHA-verifies the published artifacts
# (SCOPE-086 FR-001).
#
# When this workflow triggered on tag push it raced that flow: the tag landed,
# this job built its own archive from a hand-maintained `cp -r` list, and
# `action-gh-release` overwrote the assets sync had just verified. The published
# kit therefore lost `shared/` (@wxkanban/preflight + @wxkanban/watermark →
# "Cannot find module", dbpush dead on arrival), all 151 `.claude/` skill files,
# and the `wxAIGit` launchers (SPEC-058 Amendment B / FR-010). Diagnosed from
# field report 9cd91ed8 against v1.7.32 on 2026-07-23: published asset 486 files
# / 0 under shared/, local build 587 files / 47 under shared/.
#
# Two fixes, both load-bearing:
#   1. Trigger is workflow_dispatch — this can never clobber a verified release.
#   2. The staging list is gone. This job now runs `scripts/build-release.mjs`,
#      the same packer sync uses, so KIT_INCLUDE_DIRS/KIT_INCLUDE_FILES is the
#      single allowlist. There is no second list to forget to update.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build and publish (e.g. v1.7.33)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # [SPEC 121 / T012] Consumer-file preservation must hold before anything is
  # packed. This suite guards the defect that cost twelve consumers their work;
  # a release that cannot pass it must not be cut, so `build` depends on it.
  # Needs dev dependencies (vitest), which the build job deliberately omits.
  preservation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (including dev)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Upgrade preservation suite
        run: npx vitest run tests/unit/upgrade-kit-preservation.test.mjs

  build:
    needs: preservation-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `archiver` (used by build-release.mjs) is a runtime dependency, so
      # --omit=dev covers it. --ignore-scripts is safe: build-release.mjs builds
      # each shared/* package itself right before packing.
      - name: Install root dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Install wxkanban-agent dependencies
        working-directory: wxkanban-agent
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      # mcp-server/ removed in v1.1.0 (spec 019 Decision #1 + spec 028) — the
      # MCP runs only on wxKanban-operated infrastructure at mcp.wxperts.com.
      # The kit no longer ships an MCP server, so no build step is needed.

      - name: Build kit archives
        run: node scripts/build-release.mjs --version "${{ inputs.version }}"

      # spec 028 / T055 — run the guard against what actually got packed, not
      # against a separately assembled staging dir that could drift from it.
      - name: Verify no Postgres deps or mcp-server in kit (spec 028 T055)
        run: |
          mkdir -p staging
          tar -xzf "releases/${{ inputs.version }}/kit.tar.gz" -C staging
          bash scripts/check-no-pg-in-kit.sh staging

      # Guard against the regression this workflow itself caused: a kit without
      # shared/ bricks dbpush, and one without .claude/ ships no skills.
      - name: Verify kit completeness
        run: |
          set -euo pipefail
          for p in shared/preflight/dist/index.js shared/watermark/dist/index.js .claude wxAIGit; do
            if [ ! -e "staging/$p" ]; then
              echo "ERROR: packed kit is missing $p" >&2
              exit 1
            fi
          done
          echo "OK: shared/ dists, .claude/, and wxAIGit present in the packed kit."

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: wxKanban Orchestrator Kit ${{ inputs.version }}
          body: |
            ## wxKanban Orchestrator Kit ${{ inputs.version }}

            Built from tag `${{ inputs.version }}` by `scripts/build-release.mjs`.

            **Artifacts:**
            - `kit.tar.gz` — full kit bundle for Unix/Mac
            - `kit.zip` — full kit bundle for Windows (same contents, zip format)
            - `kit.tar.gz.sha256` / `kit.zip.sha256` — SHA-256 checksums

            **Consumption:**
            wxKanban's `/api/kit/download` endpoint fetches the appropriate archive based on the client platform (or user preference), injects per-project credentials server-side, and streams to the user. Direct download of either artifact is also supported for manual installs.

            See `CLAUDE.md` in the archive for orientation.
          files: |
            releases/${{ inputs.version }}/kit.tar.gz
            releases/${{ inputs.version }}/kit.tar.gz.sha256
            releases/${{ inputs.version }}/kit.zip
            releases/${{ inputs.version }}/kit.zip.sha256
